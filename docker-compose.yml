services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    # A stopping KRaft node flushes its logs and closes the group / share-state
    # coordinators cleanly. Docker's default grace period is 10s, past which the broker is
    # SIGKILLed mid-flush and the next start has to recover the log segments — on a seeded
    # demo volume that turns a ten-second boot into a much longer one.
    stop_grace_period: 30s
    # `unless-stopped`, not the absent default: after a host reboot or a Docker daemon
    # restart the broker comes back with the app, which does carry a restart policy. It
    # did not, so the stack came back up as an explorer pointed at nothing.
    restart: unless-stopped
    # `kafka-broker-api-versions.sh` starts a whole JVM. At the previous `interval: 5s`
    # that cost ran every five seconds for the entire life of the stack — roughly a fifth
    # of a core, permanently, to re-answer a question settled during the first minute.
    # The interval now describes the steady state and `start_period` covers the boot,
    # during which failures do not count against `retries`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Single-node dev: 1 __consumer_offsets partition instead of the default 50
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Share groups (KIP-932, Kafka 4.1+) state topic on a single node
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # internal.audit.history / internal.metrics.config are auto-created on first write
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Fixed KRaft cluster id — the apache/kafka image reads CLUSTER_ID
      # (KAFKA_CLUSTER_ID would be passed to server.properties and ignored)
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      # Persist data & metadata logs across restarts — KRaft re-uses the storage
      # formatted with the fixed CLUSTER_ID above, so metric configs and audit
      # history (internal.* topics) survive `docker compose down`.
      # `docker compose down -v` still resets everything.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a
  # fresh named volume owned by root — chown it once before the broker starts.
  kafka-data-init:
    image: apache/kafka:4.2.0
    user: root
    volumes:
      - kafka_data:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  explorer:
    build: .
    container_name: kafka-sql-explorer
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    # Only the broker. The app used to wait for `demo-setup` to complete as well, which
    # meant the UI was unreachable for the whole minute-plus the seeding takes — for data
    # it does not need to boot: the Dashboard polls every 30s, so the demo topics simply
    # appear as they are created. Seeding now runs alongside the app rather than in front
    # of it.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Bundled broker is Kafka 4.2 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    volumes:
      # Named volumes, not a bind mount. `./Kafkaexplorer.log:/app/logs/kafkaexplorer.log`
      # mounted a *file* that does not exist in the checkout (it is gitignored), so Docker
      # created a directory of that name at the repository root and Logback then failed to
      # open its log file: file logging was dead in this stack, and the root-owned mount is
      # what kept the image running as root. Logs also go to stdout — `docker compose logs
      # explorer` is the first place to look.
      - explorer_logs:/app/logs
      # flink-job-store-path (data/flink-jobs.json): job history survives a recreate.
      - explorer_data:/app/data
    # 15s of graceful web shutdown (spring.lifecycle.timeout-per-shutdown-phase) then
    # ~10s of bean destruction (ShutdownBudget, one deadline shared by every executor
    # pool), plus the JVM's exit. Docker's default 10s would SIGKILL in the middle of
    # that — losing the audit report being written to internal.audit.history.
    stop_grace_period: 35s
    restart: unless-stopped

  demo-setup:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./setup-demo.sh:/data/setup-demo.sh
      - ./seed-demo-once.sh:/data/seed-demo-once.sh
    # See seed-demo-once.sh: it waits for the broker and seeds only if the marker topic is
    # absent, so restarting the stack no longer replays ~400 records into topics that
    # already hold them.
    entrypoint: [ "sh", "-c", "sed 's/\\r$//' /data/seed-demo-once.sh > /tmp/seed-demo-once.sh && sh /tmp/seed-demo-once.sh kafka:29092" ]

volumes:
  kafka_data:
  explorer_logs:
  explorer_data:
