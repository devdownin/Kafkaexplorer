# Overlay: serve a 3B chat model instead of the default 7B.
#
#   docker compose -f docker-compose-spectra-hub.yml -f docker-compose-spectra-hub.small.yml up -d
#
# WHY IT EXISTS. The default is Qwen2.5-7B quantised to Q4: ~4.7 GB of weights, ~16 GB of RAM
# for the stack, and minutes per Process Mining analysis on CPU — which is precisely what makes
# the 300 s request timeouts in the base file load-bearing rather than decorative. A 3B model is
# ~2 GB, runs in about half the memory, and answers in a fraction of the time. It reasons less
# well: this is a trade, and it is the right one on a laptop, for a demo, or in a smoke test.
#
# WHY IT IS ALSO A DOWNLOAD. `spectra-api` installs the DEFAULT chat model by itself, through
# the Model Hub, which registers it. It knows how to install that one and no other — for
# anything else it says so and installs nothing — so a different model means naming its URL,
# which is what SPECTRA_CHAT_MODEL_URL does and what the `spectra-models` one-shot then fetches.
# The auto-install is turned off here for the same reason: leaving it on would have the API
# report a model it cannot install at every boot, about a model that is already being fetched.
#
# The three names must agree, and that is why they are set together rather than left to be
# guessed: the FILE is what llama-server opens, the NAME is the alias it answers under and what
# spectra-api records in its registry, and the URL is where the file comes from.
#
# Another model: change all three. Anything Qwen2.5-family keeps the alias convention; for a
# different family, take the alias from the model card. Pin SPECTRA_CHAT_MODEL_SHA256 too — the
# one-shot prints the digest it obtained on the first run, ready to copy.
services:
  spectra-api:
    environment:
      - SPECTRA_LLM_MODEL=${LLM_CHAT_MODEL_NAME:-qwen2.5-3b-instruct}
      - SPECTRA_LLM_CHAT_FILE=${LLM_CHAT_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}
      - SPECTRA_STARTUP_AUTO_INSTALL_MODELS=false

  llm-chat:
    environment:
      - LLM_CHAT_MODEL_FILE=${LLM_CHAT_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}
      - LLM_CHAT_MODEL_NAME=${LLM_CHAT_MODEL_NAME:-qwen2.5-3b-instruct}

  spectra-models:
    environment:
      - LLM_CHAT_MODEL_FILE=${LLM_CHAT_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}
      - SPECTRA_CHAT_MODEL_URL=${SPECTRA_CHAT_MODEL_URL:-https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf}
