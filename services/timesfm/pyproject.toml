[project]
name = "kex-timesfm-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.1",
  "uvicorn==0.54.0",
  "numpy==2.4.6",
  "timesfm==2.0.2",
  "torch==2.13.0",
  "huggingface-hub==1.11.0",
]

[dependency-groups]
test = ["httpx==0.28.1", "pytest==9.0.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_model: downloads and executes the pinned checkpoint; opt-in only",
]
