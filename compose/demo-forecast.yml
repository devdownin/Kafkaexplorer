# Overlay: live traffic and a seeded history, so the forecast demo can be seen working rather
# than waited for. `./demo.sh` layers it after compose/forecasts.yml, which it needs (PostgreSQL
# and the history the Explorer records into it); nothing else uses it.
#
#   demo-live ............ keeps five topic pairs moving (demo.live.*): orders not yet shipped,
#                          degrading towards their threshold; a request backlog on an hourly cycle;
#                          imports creeping up with noise; a noisy stationary series; a level that
#                          shifts — five different things for a forecast to do. The rest of the
#                          demo's topics are seeded once and stand still, so a metric over them has
#                          one value for ever and nothing to forecast.
#   demo-forecast-seed ... creates the five metrics over those topics, writes the nine hours
#                          before the Explorer's first real recording of each (marked
#                          `demo-seed-<n>`), and starts the unshipped-orders forecast. The four
#                          others are left to the Forecast button, or "Forecast all eligible".
#
# Both read scripts/demo-forecast/ — signals.awk is the one definition of the five curves, so the
# seeded past and the live traffic are one signal. docs/metrics-demo-scenarios.md tells the story.
#
# Paths are the project root's, as in forecasts.yml: Compose resolves every relative path against
# the first file's directory, which here is docker-compose.yml's. Each script is copied through
# `sed` first, as the seeders' entrypoints do, so a CRLF checkout on Windows does not break it.
services:

  # Dedicated named volume: the UI runs as UID 10001, the live generator only reads it.
  # No Docker socket and no writable host mount. The helper uses the Kafka image already pulled.
  demo-control-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    user: "0:0"
    volumes:
      - demo_control:/demo-control
      # Compatibility with scenario commands issued before the first stack startup.
      - ${FORECAST_CONFIG_DIR:-./.forecast-stack/config}:/legacy:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /demo-control/demo-scenario.conf ] && [ -f /legacy/demo-scenario.conf ]; then
          cp /legacy/demo-scenario.conf /demo-control/demo-scenario.conf
        fi
        chown -R 10001:10001 /demo-control
    restart: "no"

  demo-live:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    depends_on:
      kafka:
        condition: service_healthy
      demo-control-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/demo-forecast:/demo-forecast:ro
      # The generator cannot modify the control selected by the UI/CLI.
      - demo_control:/demo-control:ro
    environment:
      DEMO_SCENARIO_FILE: /demo-control/demo-scenario.conf
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /tmp/demo-forecast
        for f in /demo-forecast/*; do sed 's/\r$$//' "$$f" > "/tmp/demo-forecast/$$(basename "$$f")"; done
        exec sh /tmp/demo-forecast/live.sh kafka:29092
    # A traffic generator that stops leaves the curves flat: bring it back.
    restart: unless-stopped

  demo-forecast-seed:
    image: postgres:17.6-alpine
    # No depends_on: forecast-postgres is forecasts.yml's, and seed.sh waits for PostgreSQL and for
    # the Explorer by asking them, which also answers when they are up but not yet ready.
    volumes:
      - ./scripts/demo-forecast:/demo-forecast:ro
    environment:
      PGHOST: forecast-postgres
      PGUSER: forecasts
      PGDATABASE: forecasts
      PGPASSWORD: ${FORECAST_POSTGRES_PASSWORD:-}
      EXPLORER_URL: http://explorer:8080
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /tmp/demo-forecast
        for f in /demo-forecast/*; do sed 's/\r$$//' "$$f" > "/tmp/demo-forecast/$$(basename "$$f")"; done
        exec sh /tmp/demo-forecast/seed.sh
    # Once per `up`, and idempotent: a history already seeded is left alone.
    restart: "no"
    # PostgreSQL is on the private network; the Explorer, to create the metrics, on the default one.
    networks:
      - default
      - timesfm_private

  explorer:
    depends_on:
      demo-control-init:
        condition: service_completed_successfully
    environment:
      # Not defined in the normal application; only a deliberate demo Compose stack exposes it.
      EXPLORER_DEMO_CONTROL_ENABLED: "true"
      EXPLORER_DEMO_CONTROL_FILE: /app/demo-control/demo-scenario.conf
    volumes:
      - demo_control:/app/demo-control

networks:
  timesfm_private:
    internal: true

volumes:
  demo_control:
