# The MCP server, as an OVERLAY on docker-compose.yml.
# Local endpoint: http://localhost:${EXPLORER_PORT:-8080}/mcp. Production requires TLS; this local
# overlay explicitly opts out because it is a development stack.
services:
  explorer:
    environment:
      - EXPLORER_MCP_ENABLED=true
      - EXPLORER_MCP_AUTH_TOKEN=${EXPLORER_MCP_AUTH_TOKEN:?set EXPLORER_MCP_AUTH_TOKEN before starting the MCP overlay}
      # Explicit development-only cleartext exception. Production uses the secure default.
      - EXPLORER_MCP_REQUIRE_TLS=false
      - EXPLORER_MCP_READONLY=${EXPLORER_MCP_READONLY:-true}
      - EXPLORER_MCP_ALLOWED_TOPIC_PREFIXES=${EXPLORER_MCP_ALLOWED_TOPIC_PREFIXES:-*}
      - EXPLORER_MCP_ALLOWED_GROUP_PREFIXES=${EXPLORER_MCP_ALLOWED_GROUP_PREFIXES:-*}
      - EXPLORER_MCP_TOOLS_DENIED=${EXPLORER_MCP_TOOLS_DENIED:-}
      - EXPLORER_MCP_RATE_LIMIT_CALLS_PER_MINUTE=${EXPLORER_MCP_RATE_LIMIT_CALLS_PER_MINUTE:-120}
      - EXPLORER_MCP_RATE_LIMIT_BURST=${EXPLORER_MCP_RATE_LIMIT_BURST:-20}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - EXPLORER_MCP_CONSOLE_ALLOW_RUNTIME_TOGGLE=${EXPLORER_MCP_CONSOLE_ALLOW_RUNTIME_TOGGLE:-true}
      - EXPLORER_MCP_HARD_MAX_TOPICS=${EXPLORER_MCP_HARD_MAX_TOPICS:-200}
      - EXPLORER_MCP_DEFAULT_BUDGET_MS=${EXPLORER_MCP_DEFAULT_BUDGET_MS:-20000}
      - EXPLORER_MCP_DLP_MODE=${EXPLORER_MCP_DLP_MODE:-redact}
      - EXPLORER_MCP_APPROVAL_REQUIRED_TOOLS=${EXPLORER_MCP_APPROVAL_REQUIRED_TOOLS:-kex_produce_message,kex_set_cluster_target,kex_create_metric}
      - EXPLORER_MCP_CONSOLE_ALLOW_TRY_IT=${EXPLORER_MCP_CONSOLE_ALLOW_TRY_IT:-false}
      - EXPLORER_MCP_AUDIT_TOPIC=${EXPLORER_MCP_AUDIT_TOPIC:-internal.mcp.audit}

  mcp-probe:
    image: curlimages/curl:8.21.0
    profiles: ["probe"]
    depends_on:
      explorer:
        condition: service_started
    volumes:
      - ./mcp-probe.sh:/data/mcp-probe.sh:ro
    environment:
      - MCP_BASE_URL=http://explorer:8080
      - MCP_PROBE_TOPIC_PREFIX=${MCP_PROBE_TOPIC_PREFIX:-demo.}
      - MCP_AUTH_TOKEN=${EXPLORER_MCP_AUTH_TOKEN:?set EXPLORER_MCP_AUTH_TOKEN before starting the MCP probe}
    entrypoint: ["sh", "-c", "sed 's/\\r$//' /data/mcp-probe.sh > /tmp/mcp-probe.sh && sh /tmp/mcp-probe.sh"]
