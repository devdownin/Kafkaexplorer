# The MCP server, as an OVERLAY on docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f compose/mcp.yml up -d
#   ./setup-demo.sh localhost:9092            # if the seeder has not finished yet
#   docker compose -f docker-compose.yml -f compose/mcp.yml --profile probe run --rm mcp-probe
#
# WHY THIS FILE EXISTS. `explorer.mcp.enabled` is false in application.yml and that default is
# the posture, not an oversight — pointing a language model at a Kafka cluster is a decision an
# operator makes deliberately. The consequence was that trying the MCP surface meant editing YAML
# by hand, so the one thing five phases of work built could not be run from this repository at
# all. This overlay is that decision written down once: MCP on, every guard left at the value
# application.yml ships, and each of them exposed as a variable so a scenario can move ONE of them
# without touching a file. `SPECAGENT.md` §5.1 names this file as its prerequisite.
#
# The endpoint is `http://localhost:${EXPLORER_PORT:-8080}/mcp` (streamable HTTP) and the console
# is the `/mcp` page of the same application — no second port is published, because there is no
# second server: the tools run in the process that serves the UI, on its caches and its budgets.
#
# WHAT IS DELIBERATELY NOT HERE. Authentication. `SPEC-MCP.md` puts OAuth 2.1 in front of `/mcp`
# and this application authenticates nothing (SECURITY.md), so the surface this overlay opens is
# protected by BIND_ADDR and by nothing else. Keep it on the loopback.
#
# Relative paths resolve against the PROJECT directory — the directory of the FIRST `-f` file,
# which is the repository root since docker-compose.yml always comes first. That is why
# `./mcp-probe.sh` below is written from the root and not from here.
services:
  explorer:
    environment:
      # The single switch. Not interpolated: an overlay named `mcp.yml` that could be layered
      # with MCP off would be a file whose name is a suggestion.
      - EXPLORER_MCP_ENABLED=true

      # Read-only is enforced at REGISTRATION: with this true a mutating tool is not a bean, so
      # it is absent from tools/list and cannot be invoked by name whatever a prompt says. Set it
      # false and the write surface is registered — today that surface is empty (no mutating tool
      # has been written yet), so flipping it changes what the console reports and nothing else.
      - EXPLORER_MCP_READONLY=${EXPLORER_MCP_READONLY:-true}

      # Scope, checked before any Kafka call rather than after — a scope check that runs after the
      # read has already disclosed what it was refusing. `*` places no restriction. This is the
      # knob a scope scenario moves: `EXPLORER_MCP_ALLOWED_TOPIC_PREFIXES=demo.orders.` makes every
      # tool refuse `demo.payments.dlq` with -32041 and say so by name.
      - EXPLORER_MCP_ALLOWED_TOPIC_PREFIXES=${EXPLORER_MCP_ALLOWED_TOPIC_PREFIXES:-*}
      - EXPLORER_MCP_ALLOWED_GROUP_PREFIXES=${EXPLORER_MCP_ALLOWED_GROUP_PREFIXES:-*}

      # Enforced by ABSENCE: a denied tool is filtered out of the specification list before the
      # transport sees it, so it is never described to the model, chosen, and then refused after a
      # round trip. `EXPLORER_MCP_TOOLS_DENIED=kex_sql_query` is how a scenario asks whether the
      # agent notices a capability it does not have instead of inventing one.
      - EXPLORER_MCP_TOOLS_DENIED=${EXPLORER_MCP_TOOLS_DENIED:-}

      # An operator clicks; a model loops. Drop the two to something small
      # (`..._CALLS_PER_MINUTE=4`, `..._BURST=2`) and the -32029 refusal — which names how long to
      # wait — becomes reachable in a scenario instead of only in a unit test. Zero turns it off.
      - EXPLORER_MCP_RATE_LIMIT_CALLS_PER_MINUTE=${EXPLORER_MCP_RATE_LIMIT_CALLS_PER_MINUTE:-120}
      - EXPLORER_MCP_RATE_LIMIT_BURST=${EXPLORER_MCP_RATE_LIMIT_BURST:-20}

      # redact | block | off. `block` refuses a payload carrying a credential outright (-32045)
      # rather than returning it masked; the demo topics carry no secrets, so a scenario that wants
      # to see either behaviour has to produce one.
      - EXPLORER_MCP_DLP_MODE=${EXPLORER_MCP_DLP_MODE:-redact}

      # OFF, and the default is the posture rather than caution: "Try it" executes the real tool
      # over POST /api/mcp/try/{tool}, an application endpoint on a stack with no authentication —
      # an operator who put OAuth in front of /mcp would reasonably believe the tool surface was
      # closed, and this would bypass it. The console is fully usable without it. Turn it on only
      # on the loopback, when driving the guard by hand is the point.
      - EXPLORER_MCP_CONSOLE_ALLOW_TRY_IT=${EXPLORER_MCP_CONSOLE_ALLOW_TRY_IT:-false}

      # The call trail (`/api/mcp/calls/replay` reads it back). Not created here: the broker in
      # this stack has auto-creation on, and a failed append never fails the call — it increments
      # explorer_mcp_audit_write_errors_total, and that counter moving is the signal that the trail
      # has holes. On a cluster without auto-creation, create it append-only before starting.
      - EXPLORER_MCP_AUDIT_TOPIC=${EXPLORER_MCP_AUDIT_TOPIC:-internal.mcp.audit}

  # ── Smoke probe ───────────────────────────────────────────────────────────────────────
  # Under a profile, so `up -d` never starts it: it is a one-shot, and `run --rm` is how a one-shot
  # is invoked in this repository (compose/build.yml sets the precedent).
  #
  #   docker compose -f docker-compose.yml -f compose/mcp.yml --profile probe run --rm mcp-probe
  #
  # It answers the one question an agent harness cannot answer for you when it fails: is the
  # surface there at all? Full JSON-RPC handshake, tools/list, and one real call whose `coverage`
  # it prints — so a red harness run separates "the server is not answering" from "the model
  # reasoned badly", which are the same symptom from inside a scenario.
  #
  # Same pinned curl image as compose/ollama.yml. `depends_on` is not enough — the base `explorer`
  # has no healthcheck — so the script waits on /actuator/health itself.
  mcp-probe:
    image: curlimages/curl:8.21.0
    profiles: ["probe"]
    depends_on:
      explorer:
        condition: service_started
    volumes:
      - ./mcp-probe.sh:/data/mcp-probe.sh:ro
    environment:
      - MCP_BASE_URL=http://explorer:8080
      - MCP_PROBE_TOPIC_PREFIX=${MCP_PROBE_TOPIC_PREFIX:-demo.}
    # Copied out of the read-only mount before the CRLF strip, exactly as the demo seeders do: a
    # checkout with `core.autocrlf=true` otherwise hands `sh` a script whose every line ends in a
    # character it reads as part of the command.
    entrypoint: ["sh", "-c", "sed 's/\\r$//' /data/mcp-probe.sh > /tmp/mcp-probe.sh && sh /tmp/mcp-probe.sh"]
