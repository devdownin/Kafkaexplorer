# Forecasts with no download at start: TimesFM 2.5 and Timestral-28M (the Mistral AI model, scored
# as a shadow beside it) come inside the image, so nothing in the stack needs a route to the Hub.
#
#   bin/forecast-stack.sh --offline
#
# which is `--prepare-only` (the credentials and the configuration directory, generated once under
# .forecast-stack/) followed by
#
#   docker compose --env-file .forecast-stack/.env \
#     -f docker-compose.yml -f compose/forecasts.yml -f compose/forecast-offline.yml up -d
#
# Both files are needed: this one only retargets what compose/forecasts.yml defines.
#
# An overlay of `compose/forecasts.yml`, like `compose/local-ai.yml`: alone on the base it names
# services with no image. What it changes there, and only that:
#
#   * `timesfm` runs `ghcr.io/devdownin/kex-forecast` (the `offline` target of
#     `services/timesfm/Dockerfile`, published by `.github/workflows/forecast-image.yml`). The
#     `build:` block stays, so `docker compose build timesfm` makes the same image from a checkout,
#     which needs the Hub once, at build time.
#   * the `timesfm_models` volume is not mounted. It would hide the baked-in checkpoints under an
#     empty directory, and read-only weights need no persistence.
#   * the one-shot download service moves to the `prefetch` profile and `timesfm` stops waiting
#     for it: there is nothing left for it to fetch.
#   * the Timestral pin is the baked one and the shadow is on, since the image carries it.
#
# **Which Timestral.** One image per checkpoint: the plain tag carries the 28M, and
# `-timestral-5m`, `-timestral-123m`, `-timestral-209m` the others. Choose with two variables, the
# model and its image, e.g. TIMESTRAL_MODEL=mistralai/Timestral-123M and
# FORECAST_IMAGE_TAG=0.4.0-timestral-123m. A mismatch stops the worker with a message naming the tag.
#
# Pulling the images is the only network use left, and `docker compose pull` does it ahead of
# time; `docker save` / `docker load` carries the five images to a host with no registry access.
#
# **Licence.** The image carries Timestral-28M under Mistral AI's modified MIT licence, which
# withdraws its rights from a company whose monthly revenue exceeded USD 20 million. Running
# this overlay is accepting that; TimesFM alone (Apache-2.0) is
# `compose/forecasts.yml` without it. See services/timesfm/licenses/NOTICE.md.
services:
  timesfm:
    image: ghcr.io/devdownin/kex-forecast:${FORECAST_IMAGE_TAG:-0.3.0}
    build:
      target: offline
    pull_policy: missing
    volumes: !reset []
    # Replaces the wait for the download service. It names `forecast-postgres` on purpose, though the
    # worker does not read the database: that service exists only in compose/forecasts.yml, so this
    # overlay used WITHOUT it fails at `config` with "undefined service" instead of starting a bare
    # `timesfm` beside an Explorer that has no inference, no history and no credentials (the panel
    # then reads "The forecast stack is not running"). `bin/forecast-stack.sh --offline` is the
    # command that cannot get this wrong.
    depends_on: !override
      forecast-postgres:
        condition: service_healthy
    environment:
      # The pin is the image's own (its ENV, set from the build arguments): removing compose/timesfm.yml's
      # empty defaults lets it through, and an operator's TIMESTRAL_REVISION read for another stack
      # cannot contradict the checkpoint the image carries. TIMESTRAL_MODEL stays the shared
      # variable, so the Explorer and the worker name the same model; the worker refuses one its
      # image does not carry (TIMESTRAL_BAKED_MODEL) and names the tag to run instead.
      TIMESTRAL_REVISION: !reset null
      TIMESTRAL_SHA256: !reset null
      HF_HUB_OFFLINE: "1"

  forecast-model-prefetch:
    profiles: ["prefetch"]

  explorer:
    environment:
      EXPLORER_FORECASTING_INFERENCE_SHADOW_ENABLED: ${TIMESTRAL_SHADOW_ENABLED:-true}
