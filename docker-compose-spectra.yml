# Kafka Explorer + SpectraLLM — single-command combined stack.
#
# Brings up a Kafka broker (with demo topics), Kafka Explorer, and a full local
# SpectraLLM instance, wired so Kafka Explorer runs its message-exchange audit
# (Process Mining) against SpectraLLM via its API — 100% local, no API key.
#
# Prerequisites
#   * SpectraLLM checked out next to this repo (sibling dir). Override the path
#     with SPECTRALLM_DIR=/path/to/SpectraLLM if it lives elsewhere.
#   * SpectraLLM models downloaded once (GGUF files under <SpectraLLM>/data/models):
#         cd ../SpectraLLM && ./scripts/start.sh --first-run   # then Ctrl-C once pulled
#     The chat/embed llama.cpp servers need those files to answer audit queries.
#   * Docker Compose v2.20+ (for the `include:` element).
#
# Usage
#   docker compose -f docker-compose-spectra.yml up -d --build
#
# Endpoints
#   Kafka Explorer UI ....... http://localhost:8090   (remapped: SpectraLLM API owns 8080)
#   SpectraLLM UI ........... http://localhost
#   SpectraLLM API .......... http://localhost:8080   (POST /api/query)
#   Kafka (from host) ....... localhost:9092
#
# In the Explorer Config page the LLM provider is pre-set to SpectraLLM
# (base-url http://spectra-api:8080). Toggle "Enrich audit with RAG" there to
# switch use-rag on/off at runtime.

name: kafka-explorer-spectra

# Pull in the entire SpectraLLM stack (chromadb, llm-chat, llm-embed,
# spectra-api, frontend). project_directory keeps SpectraLLM's own relative
# paths (./data/models, ./scripts/...) resolving against its repo root, exactly
# as its native `docker compose --project-directory .` invocation does.
include:
  - path: ${SPECTRALLM_DIR:-../SpectraLLM}/deploy/docker/docker-compose.yml
    project_directory: ${SPECTRALLM_DIR:-../SpectraLLM}

services:
  # No `container_name`. It is a *daemon-global* name, so two stacks could never run
  # side by side — and these files share it (`kafka`, `kafka-sql-explorer`), which also
  # made switching between them without a `down` first fail on a name collision. Compose
  # derives `<project>-<service>-<n>` instead, so `docker compose -p other … up` is enough
  # to get a second, fully independent stack.
  #
  # The project name still defaults to the directory, so `kafka_data` keeps its name and
  # the topics you already seeded are still there. Address services by service name:
  # `docker compose logs kafka`, `docker compose exec explorer sh`.
  # ── Kafka broker to explore (KRaft, single node) ──────────────────────────
  # `extends`, not a copy. This block was sixty lines duplicated from
  # docker-compose.yml, and the resolved services differed in exactly two variables —
  # the two that carry the service name. Everything that has a reason behind it (the
  # 30s healthcheck interval and what it costs at 5s, the grace period a flushing KRaft
  # node needs, `unless-stopped`, the single-partition __consumer_offsets, the fixed
  # CLUSTER_ID) is reasoned about once, in that file, instead of being maintained twice
  # and drifting the first time only one copy is touched.
  #
  # The service is still named `explorer-kafka` and that is load-bearing: the include
  # above carries SpectraLLM's own profile-gated `kafka`, a same-named service MERGES
  # with it and INHERITS its profile, and the broker then does not exist at all unless
  # that profile is activated — `depends_on: kafka` stops resolving and the whole
  # project is rejected as invalid. `profiles: []` here does not clear it. `extends` is
  # what lets us reuse the definition under a different name, which a second `-f` could
  # not do.
  #
  # `depends_on` is restated rather than inherited: Compose v5 does carry it through
  # `extends`, earlier specifications excluded it, and this stack already requires
  # v2.20+ for `include:` — three lines are cheaper than depending on which of the two
  # a contributor's Docker follows. Top-level volumes are NOT inherited; `kafka_data`
  # is declared at the bottom of this file for that reason.
  explorer-kafka:
    extends:
      file: docker-compose.yml
      service: kafka
    environment:
      # The two settings the rename touches, and the rule rather than a snapshot: ANY
      # setting added to the base broker that embeds the service name has to be
      # overridden here too. A broker that advertises a name nothing can resolve does
      # not refuse the connection — it accepts it and then hands the client an address
      # it cannot reach, which surfaces as a timeout somewhere else entirely.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@explorer-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://explorer-kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a
  # fresh named volume owned by root — chown it once before the broker starts.
  # Identical to docker-compose.yml's, so it is taken from there rather than copied.
  kafka-data-init:
    extends:
      file: docker-compose.yml
      service: kafka-data-init

  # ── Seed demo topics (70+) ────────────────────────────────────────────────
  demo-setup:
    image: apache/kafka:4.3.1
    depends_on:
      explorer-kafka:
        condition: service_healthy
    volumes:
      - ./setup-demo.sh:/data/setup-demo.sh
      - ./seed-demo-once.sh:/data/seed-demo-once.sh
    # Idempotent: see seed-demo-once.sh. `$$` escapes the `$` for compose interpolation,
    # which this file needs (it uses ${SPECTRALLM_DIR}) and the others do not.
    entrypoint: ["sh", "-c", "sed 's/\\r$$//' /data/seed-demo-once.sh > /tmp/seed-demo-once.sh && sh /tmp/seed-demo-once.sh explorer-kafka:29092"]

  # ── Kafka Explorer, auditing via SpectraLLM ───────────────────────────────
  explorer:
    build: .
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8090}:8080"   # SpectraLLM API already publishes host 8080
    # The broker only. Not `demo-setup` — seeding runs alongside the app instead of in front of
    # it, so the UI is up in seconds rather than after the whole seed — and no longer
    # `spectra-api` either: this application does not need a model to boot, it needs one when
    # somebody opens Process Mining. Waiting on it held the UI back for the API's own startup,
    # and on a first run for the model download behind it. Same rule as everywhere else here:
    # keep what the app does not need beside it, never in front of it.
    depends_on:
      explorer-kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=explorer-kafka:29092
      # Bundled broker is Kafka 4.3 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
      - CLAUDE_PROVIDER=SPECTRA
      - CLAUDE_BASE_URL=http://spectra-api:8080
      - CLAUDE_USE_RAG=${EXPLORER_USE_RAG:-false}
      # Kept in step with docker-compose-spectra-hub.yml, and for the same two reasons. The
      # prompt has to fit the window: ~16 000 characters is ~4 000 tokens, which fits whatever
      # `LLM_CONTEXT` the SpectraLLM checkout ends up giving llama-server (its default lets the
      # server decide from the API's sizing hints, so the conservative figure is the safe one),
      # where the shipped 120 000 would be truncated in silence. And a 7B Q4 model on CPU takes
      # minutes, while a request timeout is terminal on this path — the shipped 60 s is sized
      # for a hosted API.
      - PROCESS_MINING_PROMPT_CHAR_BUDGET=${EXPLORER_PROMPT_CHAR_BUDGET:-16000}
      - CLAUDE_REQUEST_TIMEOUT_SECONDS=${EXPLORER_LLM_TIMEOUT:-300}
    volumes:
      - explorer_logs:/app/logs
      - explorer_data:/app/data
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  kafka_data:
  explorer_logs:
  explorer_data:
