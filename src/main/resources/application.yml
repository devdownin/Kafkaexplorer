server:
  # On SIGTERM — every `docker compose down`, every container replacement — the default
  # `immediate` cuts in-flight requests at the socket. This application has requests that
  # legitimately run for tens of seconds: a cluster audit, a whole-cluster stream-flow
  # trace, a Flink SELECT. Graceful lets them finish (or hit their own budget) instead of
  # answering a truncated response, and the compose stacks give the container a
  # `stop_grace_period` long enough to cover this plus bean destruction.
  shutdown: graceful

spring:
  application:
    name: kafka-sql-explorer

  lifecycle:
    # Upper bound on the graceful phase above: enough for a query at the 10s default
    # timeout plus its teardown. It is also half of the container's stop budget — the
    # stacks allow 35s, which is this phase followed by ~10s of bean destruction
    # (ShutdownBudget) and the JVM's own exit. Raising it means raising
    # `stop_grace_period` too, or Docker will SIGKILL what this was meant to protect.
    timeout-per-shutdown-phase: 15s

  cache:
    type: caffeine
    # TTL is configured by the CacheManager bean in WebConfig (explorer.cache-expire-seconds,
    # default 30s) — a `spring.cache.caffeine.spec` here would be silently ignored.

kafka:
  bootstrap-servers: localhost:9092
  schema-registry-url: http://localhost:8081
  mode: PLAIN # Possible values: PLAIN, SSL, CONFLUENT_CLOUD
  # Rebalance protocol for the group-managed (subscribe) consumer used by live
  # Process Mining sessions. "consumer" is KIP-848 incremental rebalancing and is
  # what every bundled stack already set explicitly, so this aligns the shipped
  # configuration with the brokers this project runs (Kafka 4.3 in KRaft mode).
  # It **requires a Kafka 4.x broker**: against an older one, set "classic" here
  # or export KAFKA_CONSUMER_GROUP_PROTOCOL=classic — that protocol works with
  # any broker version and is what `KafkaConfig` still falls back to when the
  # property is absent altogether.
  consumer-group-protocol: consumer

  # --- SSL Configuration Example ---
  # mode: SSL
  # truststore-path: /path/to/truststore.jks
  # truststore-password: password
  # keystore-path: /path/to/keystore.jks
  # keystore-password: password
  # key-password: password

  # --- Confluent Cloud Configuration Example ---
  # mode: CONFLUENT_CLOUD
  # bootstrap-servers: your-confluent-cloud-bootstrap:9092
  # confluent-key: YOUR_API_KEY
  # confluent-secret: YOUR_API_SECRET

explorer:
  # Label shown in the header's connection pill. A display name, not a fact about the broker:
  # nothing verifies it, and POST /api/config can repoint the app while it stays put. It used to
  # read "KRAFT 4.2", so every deployment asserted a Kafka version it had never checked. Name your
  # environment here (EXPLORER_CLUSTER_NAME) — "Staging", "Orders prod" — the effective bootstrap
  # address is shown beside it on hover, and that one is read from the running configuration.
  cluster-name: Kafka cluster
  # Préfixe des topics que l'application s'écrit à elle-même — l'historique d'audit, les
  # configurations de métriques et les mappings de champs validés. Vide par défaut, et vide ne
  # change rien : les topics gardent leurs noms `internal.*`. À poser sur un déploiement qui
  # partage un cluster avec d'autres locataires, ou dont la convention de nommage réserve un
  # espace par application — le même besoin auquel `consumer-group-prefix` répond pour les
  # groupes. Il ne renomme QUE ce que cette application écrit pour elle-même, jamais un topic des
  # pipelines de l'utilisateur. Une valeur inutilisable dans un nom de topic Kafka est refusée
  # avec un WARN nommant la propriété, et le run continue sans préfixe ; une valeur sans
  # séparateur final en reçoit un (`acme` donne `acme.internal.audit.history`).
  # ATTENTION : ce n'est pas rétroactif. Le changer pointe l'application vers d'autres topics, il
  # ne déplace pas ce que le réglage précédent a écrit — un opérateur qui le pose sur un
  # déploiement vivant repart sur un historique d'audit vierge.
  internal-topic-prefix: ${EXPLORER_INTERNAL_TOPIC_PREFIX:}
  audit-history-topic: internal.audit.history
  # Where the field mappings validated in Process Mining are kept, keyed by mapping id (so the
  # topic is meant to be compacted). The mapping is the only human-corrected artefact this app
  # produces; it used to live in memory alone and a restart lost it.
  field-mapping-topic: internal.field.mappings
  # Records read from the end of the history topic when listing past runs (bounded scan).
  audit-history-max-records: 200
  default-max-rows: 50
  default-query-timeout-ms: 10000
  audit-query-timeout-ms: 5000
  # Wall-clock budget for one full audit run; 0 disables it. Past the budget the run stops like a
  # cancellation and the report says how far it got — a 2 000-topic cluster with exact counts can
  # legitimately need longer, so raise it (or set 0) rather than reading a truncated report.
  audit-max-duration-ms: 1800000
  # The audit reads the cluster's consumer groups once and reuses that snapshot across topics,
  # instead of re-listing every group for each one. This is how long a snapshot stays usable before
  # being re-read; 0 takes it once for the whole run. Committed positions are therefore up to this
  # old while each topic's end offsets are read as it is audited, so a lag can only be overstated.
  audit-group-snapshot-ttl-ms: 60000
  # Which end of each topic duplicate detection reads: LATEST (default) or EARLIEST.
  audit-duplicate-scan-from: LATEST
  inference-sample-size: 10
  inference-poll-timeout-ms: 2000
  # Topic search (POST /api/topic/{name}/search). A pass stops at the first budget it hits and
  # returns a cursor, so the UI can show partial results and resume instead of blocking.
  search-max-hits: 100
  search-max-scan: 20000
  search-timeout-ms: 10000
  search-max-value-chars: 8000
  # One record read by its coordinates is meant to be read whole, unlike a search hit.
  record-max-value-chars: 1000000
  # Consumer lag (GET /api/topic/{name}/consumers, and the audit's consumer-lag check). Each group
  # costs a coordinator lookup, so the read is capped and the response says when the cap bit.
  consumer-group-max-groups: 200
  # Prefix for the consumer groups the explorer creates for ITS OWN reads — metadata, samples,
  # searches, traces, live sessions. It never renames a group belonging to your pipelines, and it
  # is not written into generated Flink DDL. Empty or unset falls back to 'kafka-explorer-', which
  # stays recognised as ours whatever this is set to, so changing it does not orphan the groups the
  # previous value left on the cluster. A separator is appended when the value has none.
  consumer-group-prefix: kafka-explorer-
  # The dashboard's activity sparkline (GET /api/dashboard/activity). It is measured from offsets
  # alone — one listOffsets per bucket boundary, no record read and no consumer group — so what it
  # counts is offsets produced, not records currently in the topic. Bounded twice: the number of
  # topics one call may measure, and partitions x boundaries, which is the real unit of work. What
  # a budget cuts is named in the response's warnings, never silently absent.
  activity-max-topics: 100
  activity-max-lookups: 20000
  # Window and number of points when the request names neither: 24 buckets of one hour.
  activity-default-window-ms: 86400000
  activity-buckets: 24
  # Ceiling on how many topics one POST /api/data-model may analyse. The request carries its own,
  # lower, per-run budget (30 by default, a field on the page, read back from
  # GET /api/data-model/limits); this is what bounds it, so a mistyped number cannot tie the
  # inference pool up for hours. Each topic costs a sample read plus schema inference, ~20 s worst
  # case, so raising this raises the worst-case wall clock of one request in proportion.
  data-model-max-topics: 100
  # Deletes, at startup, the consumer groups older builds left on the cluster (they committed
  # offsets under a random group id on every metadata read). This is the only write this
  # application ever makes to a cluster: off by default, and restricted to groups that carry one
  # of our names AND that the broker reports EMPTY or DEAD — a live session holds members and is
  # never touched. Bounded per pass, and every deleted id is logged.
  # Run one throw-away query after startup so the first real one does not pay for the planner
  # waking up. Measured: ~5.5 s for the first SELECT of a process without it, ~1.6 s with.
  # Runs on a daemon thread after the app is ready, so it never delays readiness.
  flink-warmup-enabled: true
  cleanup-own-groups: false
  cleanup-own-groups-max: 500
  # Topics whose consumer lag is exported as Prometheus gauges — named explicitly, never
  # discovered: one series per group x topic is how a metrics backend gets killed. Empty (the
  # default) registers no gauge and starts no polling thread. Example:
  #   lag-metrics-topics: [ "demo.orders", "demo.payments" ]
  lag-metrics-topics: []
  lag-metrics-max-series: 500
  # Also export the backlog in TIME (kafka_consumer_group_lag_seconds) for those topics: the age
  # of the oldest message each group has not read. Off by default because it is the only lag
  # gauge that reads a record — one per lagging partition, per group, per refresh — where the
  # others read metadata. A group caught up on every partition costs nothing and reports 0.
  lag-metrics-time: false
  flink-job-store-path: data/flink-jobs.json
  flink-job-retention-hours: 24
  # Keep what the Settings page is used to change — the bootstrap address, the connection mode and
  # its SSL/Confluent credentials, the whole LLM configuration — so that stopping the application
  # does not discard it. POST /api/config used to mutate two singletons and write nothing: the one
  # screen whose purpose is data entry was the only one whose input did not survive a restart, and
  # it reverted to the values below without saying so.
  #
  # A file rather than an internal.* Kafka topic, unlike every other store here, because these
  # settings CONTAIN the bootstrap address: a topic could neither receive a save that repoints the
  # cluster nor be found at boot. It sits beside the Flink job store under data/, a named volume in
  # every bundled stack.
  #
  # Precedence at startup is: environment variable / -D / command line, then this file, then the
  # values in this YAML. The environment wins so that changing KAFKA_BOOTSTRAP_SERVERS in a compose
  # file is never silently ignored by a file written weeks earlier — and the boot log names the
  # fields that applied to.
  settings-persistence: true
  settings-store-path: data/settings.json
  # Whether the credentials entered on that page (SSL passwords, the Confluent secret, the LLM API
  # key) are written to the file. True, because storing everything except the passwords keeps half
  # the promise and keeps it silently: the mode and the keystore path come back, and the connection
  # fails for a password nothing said had been dropped. The file is created readable by its owner
  # alone and the values never travel back out of the API. Set false for a deployment that will not
  # have them on disk — the omitted fields are then named in the save's answer and in the boot log.
  settings-store-secrets: true
  # Where the CREATE TABLE statements written in the SQL editor are kept, to be replayed into
  # Flink's in-memory catalogue at startup (governed by settings-persistence above as well — it is
  # the same question about the same deployment). A table auto-registered from a Kafka topic is NOT
  # stored: it is re-derived on demand, which is the point of auto-registration. What needed keeping
  # is the definition somebody typed, because losing it produced no error but a substitution — the
  # generated schema quietly took the hand-written one's name, and the query still returned rows,
  # minus a watermark or a chosen subset of columns.
  #
  # Dropping a table (the bin icon in the schema browser, DELETE /api/query/table/{name}) removes it
  # from Flink and stops it being restored. That gesture exists because restarting used to be the
  # only way to clear the catalogue.
  flink-table-store-path: data/flink-tables.json
  # SELECT execution: true = try the real Flink planner first and fall back to the in-process
  # direct Kafka reader on failure; false = always use the direct reader. A circuit breaker
  # disables the planner path after repeated failures (e.g. if the FlinkRelMetadataQuery NPE
  # is still present in the running Flink version).
  flink-select-enabled: true
  # How long one state restore may wait for the broker's first answer while the context is still
  # building. Two beans read a topic there — the metric configurations and the Process Mining field
  # mappings — and both used the Kafka client's 5 s default: measured with nothing listening, those
  # two waits were 10.1 s of a 14.5 s boot, spent discovering twice that nothing is there. Three
  # seconds is a wide margin over a healthy metadata call; the restore that gives up says so at
  # WARN, and the next one reads that verdict instead of paying for it again.
  startup-restore-timeout-ms: 3000

# Process Mining ingestion tuning. Defaults target "complex" payloads — JSON documents around
# 1 MB with ~10 levels of nesting — which are never buffered nor prompted verbatim: each record
# is digested (structure + mapped fields + a bounded value sample) as it arrives.
process-mining:
  # Live consumer fetch sizing. max-partition-fetch-bytes MUST exceed the largest expected
  # record, otherwise Kafka falls back to one record per fetch round trip.
  max-poll-records: 100
  max-partition-fetch-bytes: 8388608    # 8 MB
  fetch-max-bytes: 33554432             # 32 MB
  # Payload digestion
  max-payload-bytes: 4194304            # bytes actually parsed; beyond this the digest is partial
  max-depth: 12                         # deeper subtrees are skipped by the parser, not walked
  max-parse-events: 400000              # per-payload work budget
  array-sample-size: 2                  # array elements descended into (cardinality is still exact)
  max-shape-paths: 250                  # leaf paths kept per payload structure
  max-sample-fields: 40                 # non-mapped scalar values kept per message
  max-value-chars: 160
  preview-chars: 400
  shape-cache-size: 200
  max-window-digest-bytes: 33554432     # heap the buffered digests of one session may use
  # Prompt budgeting
  max-shape-paths-in-prompt: 80
  max-messages-per-topic-in-prompt: 60
  # ~30k tokens for the message section. THE MODEL'S CONTEXT WINDOW HAS TO BE LARGER, and
  # nothing here can check that: the window belongs to the endpoint, not to this application.
  # It matters most where a small local model is served, which is the default deployment —
  # Ollama's window is 4 096 tokens unless the machine has the VRAM for more, and the
  # OpenAI-compatible request carries no `num_ctx` to change it, so a prompt this size is
  # silently truncated to the newest messages that fit (Ollama logs that at DEBUG, i.e. nowhere
  # on a default install). Raise the window (`OLLAMA_CONTEXT_LENGTH`, llama.cpp's `-c`) or lower
  # this budget so the two agree — the bundled stacks set both together and say so.
  prompt-char-budget: 120000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness. The container
      # HEALTHCHECK targets liveness — "is this process able to serve" — while readiness
      # additionally requires a reachable broker (KafkaHealthIndicator, bean id `kafka`).
      # Keeping them apart matters: a broker restart must not flip the container to
      # `unhealthy`, since the app is still serving its UI and can be repointed at another
      # cluster from the Settings page, which is exactly what one needs at that moment.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kafka
    prometheus:
      enabled: true
  metrics:
    tags:
      application: kafka-sql-explorer

claude:
  # ANTHROPIC | OPENAI_COMPATIBLE | OLLAMA | OPENROUTER | SPECTRA
  #
  # OPENROUTER is the default: one hosted gateway in front of most vendors' models, so a key and a
  # model slug are all a deployment needs. It replaced OLLAMA at http://localhost:11434/v1, which
  # only ever worked for a developer running this application outside a container with Ollama on
  # the same machine — inside every image published here `localhost` is the container itself, so
  # the shipped default answered a connection refused to itself.
  #
  # What it costs is stated rather than implied: this is a hosted endpoint, so the message digests
  # Process Mining builds leave the host. Keep everything in-house with provider: OLLAMA (see
  # docker-compose-llm.yml) or provider: SPECTRA (docker-compose-spectra-hub.yml) — both of those
  # stacks name their provider explicitly and are unaffected by this default.
  provider: OPENROUTER
  # The key for whichever provider is configured — the variable names are historical, and both are
  # read so that a key set under the name its own provider documents is not silently ignored.
  # OPENROUTER_API_KEY wins when both are set; CLAUDE_API_KEY (the property's own relaxed name)
  # outranks either and is the unambiguous form on a machine that has several.
  api-key: ${OPENROUTER_API_KEY:${ANTHROPIC_API_KEY:}}
  base-url: https://openrouter.ai/api/v1
  # OpenRouter names models vendor/model. This one is cheap and supports schemas; change it to
  # anything on https://openrouter.ai/models.
  model: openai/gpt-4o-mini
  max-tokens: 4096
  snapshot-window-size: 100
  snapshot-window-timeout-seconds: 30
  # Per-call timeout (connect + request) for HTTP LLM providers (OpenAI-compatible,
  # Ollama, SpectraLLM). Transient failures (timeout, 5xx, 429) are retried with backoff;
  # 4xx fail fast. Local audit models can be slow, hence the generous default.
  request-timeout-seconds: 60
  # SPECTRA provider only: audit Kafka exchanges via a local SpectraLLM instance
  # (POST <base-url>/api/query). Set provider: SPECTRA and base-url to the SpectraLLM
  # API, e.g. http://localhost:8080 or http://spectra-api:8080 in Docker.
  # use-rag=false keeps generation grounded solely on the inlined Kafka messages;
  # set it to true to also retrieve from SpectraLLM's ingested corpus.
  use-rag: false
  # SPECTRA + use-rag only: the SpectraLLM ChromaDB collection to retrieve from.
  # Blank uses SpectraLLM's default collection.
  collection: ""
  # Whether the answer is constrained to a JSON Schema rather than merely requested as JSON in
  # the prompt. Constraining removes the "model wrapped its JSON in prose" failure instead of
  # reporting it, which matters most for the small local model this ships with by default.
  # AUTO (default) enables it where support is known — ANTHROPIC, OLLAMA and OPENROUTER — and
  # leaves an arbitrary OPENAI_COMPATIBLE gateway alone, because an unrecognised response_format is
  # a 400 on some of them and breaking a working deployment is the wrong default. ON forces it for
  # a gateway you know supports it; OFF disables it everywhere. Whatever the setting, a client that
  # gets its schema refused retries once without it and stops sending one for that model — per
  # model, not per endpoint, which is what makes AUTO safe on OpenRouter, where support depends on
  # the model and the upstream provider serving it rather than on the gateway.
  structured-output: AUTO
  # OPENROUTER only — how the gateway is allowed to route, which is the one place where "where does
  # my data go" has an answer better than a warning. DENY restricts routing to upstream providers
  # that do not retain or train on what is sent, so the Settings banner states a property instead of
  # a risk; the accepted cost is that a model served only by data-collecting providers stops being
  # routable, and the error names this setting rather than reading as a mistyped model. ALLOW widens
  # the choice of models back.
  openrouter-data-collection: DENY
  # OPENROUTER only: route only to providers implementing every parameter sent, which would make
  # structured output a routing guarantee rather than something discovered by a refusal. Off by
  # default for the same reason structured-output: AUTO leaves an unknown gateway alone — a model
  # whose providers lack schema support becomes *unroutable* instead of degrading, and that arrives
  # as "no endpoints found" rather than as the 400/422 the per-model latch can act on.
  openrouter-require-parameters: false
  # Plafond, en USD, de ce qu'une session Process Mining en direct peut dépenser avant de s'arrêter
  # d'elle-même. 0 = aucun plafond, et c'est le défaut.
  #
  # Une session live appelle le modèle à chaque fenêtre, sur minuterie, et son flux SSE vit douze
  # heures : un onglet laissé ouvert la nuit, c'est de l'ordre du millier d'analyses. C'était sans
  # conséquence tant que le fournisseur livré était un Ollama local ; ça ne l'est plus depuis qu'il
  # facture au token, et rien ne le bornait — les seules limites du pipeline portent sur la taille
  # du prompt et le nombre de messages, pas sur l'argent.
  #
  # Désactivé par défaut à dessein : tout chiffre choisi ici serait arbitraire, et une session qui
  # s'arrête seule est une surprise d'un autre genre. Ce qui rend ce défaut défendable, c'est que le
  # cumul est maintenant affiché — on mesure d'abord, on plafonne ensuite. Il ne borne que les
  # analyses d'une session (pas l'appel de profilage qui la précède) et ne peut s'appliquer que là
  # où le coût est rapporté : sur un fournisseur qui n'en rapporte aucun, la session le dit au lieu
  # de compter des appels dont elle ignore le prix.
  session-cost-limit-usd: 0

logging:
  file:
    name: logs/kafkaexplorer.log
  logback:
    rollingpolicy:
      # Spring Boot's default total-size-cap is 0B, i.e. no cap at all, and `logs/` is a named
      # volume in every bundled stack. A broker that stops answering used to write ~1.6 MB a
      # minute here (see the AdminMetadataManager note below), so the one thing that must not
      # happen is an application filling the host's disk while reporting a problem. The cap is on
      # the archive as a whole, not per file.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 7
  level:
    # INFO by default — switch to DEBUG locally when diagnosing query issues
    com.compagnonsdudev.kafkasqlexplorer: INFO
    org.apache.flink: WARN
    # Measured, not guessed at: with nothing listening on the bootstrap address, a 45 s run of
    # this application logged 103 775 lines, of which 101 943 — 98.2 % — were this one class
    # writing `Rebootstrapping with Cluster(…)` at INFO, once per admin-client metadata retry,
    # about 2 300 times a second. The application's own package contributed six lines in the same
    # window. That is not a log an operator can read at the exact moment they need to: it buries
    # the connection failure it is reporting, costs CPU, and fills the log volume.
    #
    # WARN rather than OFF: the class keeps whatever it has to say at WARN or above, and the
    # broker's unreachability is still reported — by NetworkClient (which backs off, ~140 lines
    # in the same window) and by this application's own startup summary, which names the address
    # and the reason. What is removed is the retry-by-retry narration of a fact already stated.
    org.apache.kafka.clients.admin.internals.AdminMetadataManager: WARN
