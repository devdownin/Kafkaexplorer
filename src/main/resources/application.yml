server:
  # On SIGTERM — every `docker compose down`, every container replacement — the default
  # `immediate` cuts in-flight requests at the socket. This application has requests that
  # legitimately run for tens of seconds: a cluster audit, a whole-cluster stream-flow
  # trace, a Flink SELECT. Graceful lets them finish (or hit their own budget) instead of
  # answering a truncated response, and the compose stacks give the container a
  # `stop_grace_period` long enough to cover this plus bean destruction.
  shutdown: graceful

spring:
  application:
    name: kafka-sql-explorer

  lifecycle:
    # Upper bound on the graceful phase above: enough for a query at the 10s default
    # timeout plus its teardown. It is also half of the container's stop budget — the
    # stacks allow 35s, which is this phase followed by ~10s of bean destruction
    # (ShutdownBudget) and the JVM's own exit. Raising it means raising
    # `stop_grace_period` too, or Docker will SIGKILL what this was meant to protect.
    timeout-per-shutdown-phase: 15s

  cache:
    type: caffeine
    # TTL is configured by the CacheManager bean in WebConfig (explorer.cache-expire-seconds,
    # default 30s) — a `spring.cache.caffeine.spec` here would be silently ignored.

kafka:
  bootstrap-servers: localhost:9092
  schema-registry-url: http://localhost:8081
  mode: PLAIN # Possible values: PLAIN, SSL, CONFLUENT_CLOUD
  # Rebalance protocol for the group-managed (subscribe) consumer used by live
  # Process Mining sessions. "classic" (default) works with any broker version;
  # "consumer" opts into KIP-848 incremental rebalances — requires Kafka 4.x brokers.
  consumer-group-protocol: classic

  # --- SSL Configuration Example ---
  # mode: SSL
  # truststore-path: /path/to/truststore.jks
  # truststore-password: password
  # keystore-path: /path/to/keystore.jks
  # keystore-password: password
  # key-password: password

  # --- Confluent Cloud Configuration Example ---
  # mode: CONFLUENT_CLOUD
  # bootstrap-servers: your-confluent-cloud-bootstrap:9092
  # confluent-key: YOUR_API_KEY
  # confluent-secret: YOUR_API_SECRET

explorer:
  # Label shown in the header's connection pill. A display name, not a fact about the broker:
  # nothing verifies it, and POST /api/config can repoint the app while it stays put. It used to
  # read "KRAFT 4.2", so every deployment asserted a Kafka version it had never checked. Name your
  # environment here (EXPLORER_CLUSTER_NAME) — "Staging", "Orders prod" — the effective bootstrap
  # address is shown beside it on hover, and that one is read from the running configuration.
  cluster-name: Kafka cluster
  audit-history-topic: internal.audit.history
  # Where the field mappings validated in Process Mining are kept, keyed by mapping id (so the
  # topic is meant to be compacted). The mapping is the only human-corrected artefact this app
  # produces; it used to live in memory alone and a restart lost it.
  field-mapping-topic: internal.field.mappings
  # Records read from the end of the history topic when listing past runs (bounded scan).
  audit-history-max-records: 200
  default-max-rows: 50
  default-query-timeout-ms: 10000
  audit-query-timeout-ms: 5000
  # Wall-clock budget for one full audit run; 0 disables it. Past the budget the run stops like a
  # cancellation and the report says how far it got — a 2 000-topic cluster with exact counts can
  # legitimately need longer, so raise it (or set 0) rather than reading a truncated report.
  audit-max-duration-ms: 1800000
  # The audit reads the cluster's consumer groups once and reuses that snapshot across topics,
  # instead of re-listing every group for each one. This is how long a snapshot stays usable before
  # being re-read; 0 takes it once for the whole run. Committed positions are therefore up to this
  # old while each topic's end offsets are read as it is audited, so a lag can only be overstated.
  audit-group-snapshot-ttl-ms: 60000
  # Which end of each topic duplicate detection reads: LATEST (default) or EARLIEST.
  audit-duplicate-scan-from: LATEST
  inference-sample-size: 10
  inference-poll-timeout-ms: 2000
  # Topic search (POST /api/topic/{name}/search). A pass stops at the first budget it hits and
  # returns a cursor, so the UI can show partial results and resume instead of blocking.
  search-max-hits: 100
  search-max-scan: 20000
  search-timeout-ms: 10000
  search-max-value-chars: 8000
  # One record read by its coordinates is meant to be read whole, unlike a search hit.
  record-max-value-chars: 1000000
  # Consumer lag (GET /api/topic/{name}/consumers, and the audit's consumer-lag check). Each group
  # costs a coordinator lookup, so the read is capped and the response says when the cap bit.
  consumer-group-max-groups: 200
  # Deletes, at startup, the consumer groups older builds left on the cluster (they committed
  # offsets under a random group id on every metadata read). This is the only write this
  # application ever makes to a cluster: off by default, and restricted to groups that carry one
  # of our names AND that the broker reports EMPTY or DEAD — a live session holds members and is
  # never touched. Bounded per pass, and every deleted id is logged.
  # Run one throw-away query after startup so the first real one does not pay for the planner
  # waking up. Measured: ~5.5 s for the first SELECT of a process without it, ~1.6 s with.
  # Runs on a daemon thread after the app is ready, so it never delays readiness.
  flink-warmup-enabled: true
  cleanup-own-groups: false
  cleanup-own-groups-max: 500
  # Topics whose consumer lag is exported as Prometheus gauges — named explicitly, never
  # discovered: one series per group x topic is how a metrics backend gets killed. Empty (the
  # default) registers no gauge and starts no polling thread. Example:
  #   lag-metrics-topics: [ "demo.orders", "demo.payments" ]
  lag-metrics-topics: []
  lag-metrics-max-series: 500
  # Also export the backlog in TIME (kafka_consumer_group_lag_seconds) for those topics: the age
  # of the oldest message each group has not read. Off by default because it is the only lag
  # gauge that reads a record — one per lagging partition, per group, per refresh — where the
  # others read metadata. A group caught up on every partition costs nothing and reports 0.
  lag-metrics-time: false
  flink-job-store-path: data/flink-jobs.json
  flink-job-retention-hours: 24
  # SELECT execution: true = try the real Flink planner first and fall back to the in-process
  # direct Kafka reader on failure; false = always use the direct reader. A circuit breaker
  # disables the planner path after repeated failures (e.g. if the FlinkRelMetadataQuery NPE
  # is still present in the running Flink version).
  flink-select-enabled: true

# Process Mining ingestion tuning. Defaults target "complex" payloads — JSON documents around
# 1 MB with ~10 levels of nesting — which are never buffered nor prompted verbatim: each record
# is digested (structure + mapped fields + a bounded value sample) as it arrives.
process-mining:
  # Live consumer fetch sizing. max-partition-fetch-bytes MUST exceed the largest expected
  # record, otherwise Kafka falls back to one record per fetch round trip.
  max-poll-records: 100
  max-partition-fetch-bytes: 8388608    # 8 MB
  fetch-max-bytes: 33554432             # 32 MB
  # Payload digestion
  max-payload-bytes: 4194304            # bytes actually parsed; beyond this the digest is partial
  max-depth: 12                         # deeper subtrees are skipped by the parser, not walked
  max-parse-events: 400000              # per-payload work budget
  array-sample-size: 2                  # array elements descended into (cardinality is still exact)
  max-shape-paths: 250                  # leaf paths kept per payload structure
  max-sample-fields: 40                 # non-mapped scalar values kept per message
  max-value-chars: 160
  preview-chars: 400
  shape-cache-size: 200
  max-window-digest-bytes: 33554432     # heap the buffered digests of one session may use
  # Prompt budgeting
  max-shape-paths-in-prompt: 80
  max-messages-per-topic-in-prompt: 60
  prompt-char-budget: 120000            # ~30k tokens for the message section

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness. The container
      # HEALTHCHECK targets liveness — "is this process able to serve" — while readiness
      # additionally requires a reachable broker (KafkaHealthIndicator, bean id `kafka`).
      # Keeping them apart matters: a broker restart must not flip the container to
      # `unhealthy`, since the app is still serving its UI and can be repointed at another
      # cluster from the Settings page, which is exactly what one needs at that moment.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kafka
    prometheus:
      enabled: true
  metrics:
    tags:
      application: kafka-sql-explorer

claude:
  provider: OLLAMA # ANTHROPIC | OPENAI_COMPATIBLE | OLLAMA | SPECTRA
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: http://localhost:11434/v1
  model: qwen3:4b
  max-tokens: 4096
  snapshot-window-size: 100
  snapshot-window-timeout-seconds: 30
  # Per-call timeout (connect + request) for HTTP LLM providers (OpenAI-compatible,
  # Ollama, SpectraLLM). Transient failures (timeout, 5xx, 429) are retried with backoff;
  # 4xx fail fast. Local audit models can be slow, hence the generous default.
  request-timeout-seconds: 60
  # SPECTRA provider only: audit Kafka exchanges via a local SpectraLLM instance
  # (POST <base-url>/api/query). Set provider: SPECTRA and base-url to the SpectraLLM
  # API, e.g. http://localhost:8080 or http://spectra-api:8080 in Docker.
  # use-rag=false keeps generation grounded solely on the inlined Kafka messages;
  # set it to true to also retrieve from SpectraLLM's ingested corpus.
  use-rag: false
  # SPECTRA + use-rag only: the SpectraLLM ChromaDB collection to retrieve from.
  # Blank uses SpectraLLM's default collection.
  collection: ""
  # Whether the answer is constrained to a JSON Schema rather than merely requested as JSON in
  # the prompt. Constraining removes the "model wrapped its JSON in prose" failure instead of
  # reporting it, which matters most for the small local model this ships with by default.
  # AUTO (default) enables it where support is known — ANTHROPIC and OLLAMA — and leaves an
  # arbitrary OPENAI_COMPATIBLE gateway alone, because an unrecognised response_format is a 400
  # on some of them and breaking a working deployment is the wrong default. ON forces it for a
  # gateway you know supports it; OFF disables it everywhere. Whatever the setting, a client that
  # gets its schema refused retries once without it and stops sending one to that endpoint.
  structured-output: AUTO

logging:
  file:
    name: logs/kafkaexplorer.log
  level:
    # INFO by default — switch to DEBUG locally when diagnosing query issues
    com.compagnonsdudev.kafkasqlexplorer: INFO
    org.apache.flink: WARN
