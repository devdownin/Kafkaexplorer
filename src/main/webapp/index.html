<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fb" />
    <meta name="color-scheme" content="light dark" />
    <title>Kafka Explorer</title>
    <style>
      /* Polices auto-hébergées via @fontsource / material-symbols (voir
         src/fonts.css) — aucune dépendance au CDN Google Fonts. */
      /* Fond clair immédiat avant l'hydratation React. */
      html, body { background-color: #f3f6fb; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0b0d10; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0;
      }
    </style>
    <script>
      // Apply the chosen color scheme before first paint to prevent a theme flash.
      (() => {
        let theme;
        try { theme = localStorage.getItem('kse.theme'); } catch { /* restricted storage */ }
        // A new browser session is light even if the OS is in dark mode.
        if (theme !== 'dark') theme = 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        try {
          const accent = localStorage.getItem('kse.accent');
          if (accent && /^[a-z]+$/.test(accent)) document.documentElement.dataset.accent = accent;
          if (localStorage.getItem('kse.density') === 'compact') document.documentElement.dataset.density = 'compact';
        } catch { /* restricted storage */ }
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#f3f6fb' : '#0b0d10');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
