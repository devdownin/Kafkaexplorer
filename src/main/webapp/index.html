<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="light dark" />
    <title>Kafka Explorer</title>
    <style>
      /* Polices auto-hébergées via @fontsource / material-symbols (voir
         src/fonts.css) — aucune dépendance au CDN Google Fonts. */
      /* Fond immédiat pour éviter le flash blanc avant l'hydratation React. */
      html, body { background-color: #0b0d10; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #f3f6fb; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24;
      }
    </style>
    <script>
      // Apply the chosen color scheme before first paint to prevent a theme flash.
      (() => {
        let theme;
        try { theme = localStorage.getItem('kse.theme'); } catch { /* restricted storage */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#f3f6fb' : '#0b0d10');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
