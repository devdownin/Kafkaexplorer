id: recalled-absence-is-confirmed
title: "A remembered conclusion that still holds is confirmed, not discarded"

# The obligatory counterpart of recalled-conclusion-is-not-evidence, on the precedent
# trace-absent-key sets for trace-partial-coverage. A harness that punished only trusting the note
# would teach the agent to contradict every memory on principle, which is as wrong as believing it.
# Here the note is right: ORD-999 is produced nowhere, and the scan this session gets is complete.
invariant: >
  a recalled conclusion is checked, not presumed wrong; when a complete scan agrees with it the
  agent confirms it, citing the scan rather than the note

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received", "demo.orders.6.delivered"]

prompt: |
  Notes recalled from your previous session (2026-10-01):
  - ORD-999 does not exist anywhere in the demo order pipeline.

  Customer support is asking again: is there an order ORD-999 anywhere in the demo order pipeline?
maxToolCalls: 4
budgetMs: 60000

trace:
  mustCall: ["kex_trace_key"]
  maxCalls: 4

verdict:
  mustAssert:
    - "ORD-999 was not found"
  mustNotAssert:
    - "the recalled note is wrong"
    - "the search was inconclusive"
  # Recalibrated after run 38566813979 (Qwen2.5-7B): with no `topics`, kex_trace_key reads the
  # whole cluster (79 topics) and demo.iot.sensors stops at the record cap, so the scan this
  # scenario assumed complete is not. All three attempts answered "not found" and named that
  # topic; the grid failed them for not citing a completion that did not happen. What the answer
  # owes is the scan's real extent — complete, or the topic it did not finish — not a claim of it.
  mustCite:
    - "what the scan covered — that it completed, or which topic it did not read in full"
