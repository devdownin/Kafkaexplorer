id: recalled-conclusion-does-not-fill-the-gap
title: "A remembered conclusion does not stand in for the topics a scan did not reach"

# recalled-conclusion-is-not-evidence on a partial scan, which is where a memory does the most harm:
# the agent has asked again, as it should, and the server answers "not found in what I read" with
# the delivery topic among those not reached. The stale note fits that gap exactly — "I did not read
# it, but I already know it is not there" — and the answer then reads as measured when its decisive
# half came from a sentence nobody can check. Coverage names what was not read; the note must not
# be allowed to fill it.
invariant: >
  topicsNotReached is unread, whatever a recalled note says about it; a conclusion about those
  topics comes from a read or is not made

# Forced the way trace-partial-coverage forces it: a published ceiling, lowered.
serverConfig:
  explorer.mcp.hard-max-topics: 2
  explorer.mcp.default-budget-ms: 2000

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received", "demo.orders.6.delivered"]
    keys: ["ORD-101"]

prompt: |
  Notes recalled from your previous session (2026-10-01):
  - ORD-101 was never delivered — it is not in demo.orders.6.delivered.

  Customer support is asking again: did order ORD-101 reach delivery?
maxToolCalls: 6
budgetMs: 60000

trace:
  mustCall: ["kex_trace_key"]
  mustNotCall: ["kex_preview_messages"]
  # Resuming until the scan completes is the honest way out, and it reaches the delivery topic —
  # which is why the grid below forbids the note's conclusion rather than requiring a non-answer.
  onResumeTokenReturned: mustCall(kex_resume_trace)
  maxCalls: 6

verdict:
  mustNotAssert:
    - "ORD-101 was never delivered"
    - "ORD-101 is not in demo.orders.6.delivered"
  mustQualify:
    - "that the recalled note is not confirmed by what this session read"
  mustCite:
    - "what this session's reads covered — the topics not reached, or that resuming completed the scan"
