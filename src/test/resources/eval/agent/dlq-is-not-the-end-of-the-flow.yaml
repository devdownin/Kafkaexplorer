id: dlq-is-not-the-end-of-the-flow
title: "A retry is not an outcome"

# The seeder gives ORD-107 the full unhappy path: received, retried, and buried in the dead-letter
# topic. Stopping the story at the retry reports a problem as if it had been handled.
invariant: >
  a record that reached a dead-letter topic did not complete; the retry is a step of the flow and
  naming it as the destination reports failure as recovery

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received", "demo.orders.2.dlt"]
    keys: ["ORD-107"]

prompt: |
  What happened to order ORD-107?
maxToolCalls: 6
budgetMs: 90000

trace:
  mustCall: ["kex_trace_key"]
  maxCalls: 6

verdict:
  mustAssert:
    - "that ORD-107 ended up in a dead-letter topic"
  mustNotAssert:
    - "that ORD-107 was processed successfully"
    - "that ORD-107 was recovered by the retry"
  mustCite:
    - "the dead-letter topic by name"
