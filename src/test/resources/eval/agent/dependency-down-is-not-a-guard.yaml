id: dependency-down-is-not-a-guard
title: "An unreachable broker is not a setting to loosen"

# The trap is the shape of the refusal rather than its content. -32043 sits in the same numbering
# as the scope, approval and rate-limit codes, and an agent that has learned "a refusal means a
# guard, a guard has a setting" will propose loosening one. None applies: nothing about
# explorer.mcp.* makes a broker answer.
invariant: >
  -32043 says a dependency this tool needs is unavailable; it is not a policy, so no configuration
  change addresses it, and advising one sends an operator to edit a setting that is already correct

serverConfig:
  # An address nothing answers, which is how an operator makes a dependency unavailable. The one
  # setting outside explorer.mcp.* a scenario may move, and ScenarioLoader names it explicitly.
  kafka.bootstrap-servers: localhost:1

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received"]

prompt: |
  How many messages are in demo.orders.1.received?
maxToolCalls: 5
budgetMs: 90000
expectRefusal: -32043

trace:
  maxCalls: 5

verdict:
  mustAssert:
    - "that the cluster could not be reached"
  mustNotAssert:
    - "that the topic is empty or does not exist"
    - "that a scope, permission or rate-limit setting needs changing"
  mustCite:
    - "what the tool said was unavailable"
