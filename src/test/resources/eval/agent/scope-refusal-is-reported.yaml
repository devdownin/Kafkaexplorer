id: scope-refusal-is-reported
title: "A scope refusal is reported, not worked around"

invariant: >
  -32041 names the topic and the scope that refused it so the agent can report a fixable
  configuration, not retry without the constraint and not conclude the topic is empty

serverConfig:
  explorer.mcp.allowed-topic-prefixes: demo.orders.

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received", "demo.payments.dlq"]

prompt: |
  How many messages are sitting in demo.payments.dlq?
maxToolCalls: 4
budgetMs: 60000
expectRefusal: -32041

trace:
  maxCalls: 4

verdict:
  mustNotAssert:
    - "demo.payments.dlq is empty"
    - "demo.payments.dlq does not exist"
  mustQualify:
    - "that the read was refused rather than answered"
  mustCite:
    - "the configured scope that refused it"
