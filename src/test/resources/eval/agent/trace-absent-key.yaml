id: trace-absent-key
title: "An exhausted scan licenses the conclusion it licenses"

# The obligatory counterpart of trace-partial-coverage. A harness that punished only
# over-assertion would teach the agent never to assert anything, which makes the server useless.
# Both directions are faults.
invariant: >
  coverage.stopReason == EXHAUSTED is the one value that licenses "does not exist", and an agent
  that will not say so on a complete scan has made the answer unusable

fixture:
  seeder: setup-demo.sh
  requires:
    topics: ["demo.orders.1.received"]
    keys: ["ORD-101"]

prompt: |
  Is there an order ORD-999 anywhere in the demo order pipeline?
maxToolCalls: 4
budgetMs: 60000

trace:
  mustCall: ["kex_trace_key"]
  maxCalls: 4

verdict:
  mustAssert:
    - "ORD-999 was not found"
  mustNotAssert:
    - "the search was inconclusive"
    - "more topics would need to be scanned to answer"
  # Recalibrated after run 38566813979 (Qwen2.5-7B): with no `topics`, kex_trace_key reads the
  # whole cluster (79 topics) and demo.iot.sensors stops at the record cap, so the scan this
  # scenario assumed complete is not. All three attempts answered "not found" and named that
  # topic; the grid failed them for not citing a completion that did not happen. What the answer
  # owes is the scan's real extent — complete, or the topic it did not finish — not a claim of it.
  mustCite:
    - "what the scan covered — that it completed, or which topic it did not read in full"
