version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The base images of Dockerfile / Dockerfile.release are pinned by digest, which is what
  # makes a given commit build on a given JRE — and which also freezes that JRE's security
  # patches until something proposes the bump. This is that something; without it, pinning
  # would trade reproducibility for a stale runtime, which is a bad trade.
  #
  # Grouped: node, maven and eclipse-temurin move independently but a build either works
  # on the whole set or does not, and the two Dockerfiles must be bumped together — their
  # runtime stages are deliberately identical.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"

  # The frontend was unwatched: only the Maven tree and the workflow actions were.
  # React, Vite, Monaco, axios and the rest of src/main/webapp therefore never got a
  # security or version bump, even though they ship inside the published jar and image.
  #
  # Minor and patch updates are grouped into a single pull request — an ungrouped npm
  # tree this size opens well over a dozen a week, and that volume is how bumps stop
  # being read. Majors stay separate, since those are the ones that need a human.
  - package-ecosystem: "npm"
    directory: "/src/main/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
