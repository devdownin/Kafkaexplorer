name: Repository links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-links:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Reject obsolete agent repository URLs
        run: python3 scripts/check-repository-links.py
