# The published-image pins, checked on a schedule rather than by whoever happens to open the
# next pull request.
#
# `compose/spectra-hub.yml` and `compose/image.yml` name the Explorer image by hand
# (`${EXPLORER_IMAGE_TAG:-<version>}`). Dependabot cannot read a `${VAR:-…}` default, so the
# only thing that moves it is `release.yml`, which opens a bump pull request at publication
# time — deliberately `continue-on-error`, because the image is already published by then and
# a release must never be reported as failed over a follow-up.
#
# That posture is right and it leaves a hole: when the step does not produce a pull request,
# **nothing says so**. The pin then goes stale in silence until the next pull request touching
# a file `hub-changes` gates on fails `check-image-pins.py --published` — a check about
# something it did not change. `release.yml`'s own comment records that happening twice in one
# day on two unrelated branches; it happened again over v1.9.3 and v1.9.4, which is what this
# file is here to stop.
#
# So the release keeps trying to fix it, and this asks the question on a timer instead of
# leaving the only alarm on a best-effort step. It is the same argument as Scorecard one file
# over: what decays silently needs something that looks at it when nothing else is happening.
#
# It deliberately does **not** open the bump pull request itself. That logic lives in
# `release.yml`, and a second copy of it here is exactly the drift this repository keeps
# removing — one definition, not two that agree until they do not.
name: Image pins

on:
  schedule:
    # Weekly. The pin only moves when a release publishes, so a day's staleness costs nothing;
    # what matters is that it is never a month. Wednesday 06:41 UTC — off the hour, and off
    # the days CodeQL (Monday) and Scorecard (Tuesday) already use, so the three do not queue
    # together.
    - cron: '41 6 * * 3'
  # So the question can be asked straight after a release without waiting for Wednesday.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    # The check is one registry round trip over a handful of files; anything beyond this is
    # a network that has stopped answering rather than work still in progress.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `check-image-pins.py` resolves the pin against the newest release tag, and the
          # default checkout carries no tags at all — the check would fail on their absence
          # rather than on a drift.
          fetch-tags: true

      # `--published` runs the offline rules too (nothing floats, the llama.cpp CPU and CUDA
      # tags name the same build, the Explorer pin does not name an unpublished release) and
      # then asks Docker Hub what it actually serves.
      #
      # A registry that cannot be reached is a `::warning::` inside the script, not a failure:
      # "we asked and it is stale" and "we could not ask" are different answers, and only the
      # first is a defect here. So a red run of this workflow means the pin really is behind,
      # and its message names the three files to edit.
      - name: Are the published-image pins still current?
        run: python3 docs/check-image-pins.py --published

      # The other half of keeping step with the two sibling projects: `docs/check-ecosystem.py`
      # is one file copied into three repositories, and a copy edited in one of them only drifts
      # from the other two without anything on a pull request noticing — by design, since a change
      # to it lands in three pull requests and the first merged must not fail the others.
      - name: Is the shared ecosystem script still identical across the three repositories?
        run: python3 docs/check-ecosystem.py --siblings

  # The sibling projects' pins (SpectraLLM, the Kex-anHarness agent) have no release of theirs
  # opening a pull request here, so when Docker Hub has overtaken one this job opens it instead
  # of only turning the job above red. Same shape as release.yml's follow-up: a branch, a pull
  # request, a reviewed merge — never a push to main. The pull request touches the hub files, so
  # `spectra-hub-stack` and `ecosystem-stack` boot the new images before anyone merges.
  # Opened with GITHUB_TOKEN, it starts no CI on its own (GitHub's rule against loops): close
  # and reopen it, or push to it, to run the checks. With the optional AUTOMATION_PR_TOKEN secret
  # it does.
  sibling-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      # AUTOMATION_PR_TOKEN is optional: a fine-grained token (or an App token) with contents and
      # pull-requests write on this repository. A pull request opened with it starts CI on its own;
      # without it the job falls back to GITHUB_TOKEN, whose pull requests do not.
      GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN != '' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Move the sibling pins Docker Hub has overtaken
        id: bump
        run: |
          set -euo pipefail
          python3 docs/check-image-pins.py --bump-siblings | tee bump.txt
          git diff --quiet && echo "moved=false" >> "$GITHUB_OUTPUT" || echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.bump.outputs.moved == 'true'
        run: |
          set -euo pipefail
          branch="chore/sibling-pins-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Move the sibling projects' image pins to what Docker Hub serves"
          git push -u origin "$branch"
          if [ "$HAS_PR_TOKEN" = true ]; then
            note="CI starts on its own: this pull request was opened with AUTOMATION_PR_TOKEN."
          else
            note="Opened with GITHUB_TOKEN, so CI does not start on its own: close and reopen this pull request to run \`spectra-hub-stack\` and \`ecosystem-stack\` against the new images."
          fi
          if ! gh pr create --base "$DEFAULT_BRANCH" \
            --title "Move the sibling projects' image pins to what Docker Hub serves" \
            --body "$(printf '%s\n' \
              "\`check-image-pins.py --bump-siblings\` found Docker Hub serving a newer release of a sibling project than the stacks pull:" \
              "" \
              "\`\`\`" "$(cat bump.txt)" "\`\`\`" \
              "" \
              "$note" \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            echo "::error::The branch ${branch} was pushed but no pull request could be opened. If this is a permission refusal, enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi
