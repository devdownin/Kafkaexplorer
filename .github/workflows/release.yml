name: Create Release

on:
  push:
    tags:
      # `V*` is here so an uppercase tag reaches the guard below and is *refused*, rather
      # than matching nothing and silently releasing nothing. Tag filters are
      # case-sensitive, and `V1.3` did exactly that: the tag existed, a Release was created
      # by hand, and no workflow ever ran — with no signal anywhere that it hadn't.
      - 'v*'
      - 'V*'
  # A tag push is not the only way a release starts, and the two cases it misses are both
  # silent — the failure mode this file keeps being bitten by:
  #   - publishing a Release from the GitHub UI on a tag that already exists emits no push
  #     event at all, so nothing would build;
  #   - a tag pushed by an Action using GITHUB_TOKEN does not trigger further workflows, by
  #     GitHub's anti-recursion rule, so any future automation around tagging would silently
  #     stop releasing.
  # That same anti-recursion rule is what makes this trigger safe: the Release *this*
  # workflow creates is created with GITHUB_TOKEN, so it cannot fire this trigger and loop.
  release:
    types: [published]

# Publishing a Release from the UI *with a new tag* fires both triggers at once, and two
# concurrent runs would push the same tags twice and append the digest block to the notes
# twice — a visible duplication. Grouping on the tag keeps one run; `cancel-in-progress`
# lets the later one (the release event, which carries the fuller context) supersede the
# earlier rather than queue behind it and redo everything.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

# The tag being released, resolved once. `github.ref_name` is the tag on both events, but
# only by virtue of a release event's ref pointing at it — reading the release payload
# first states what is meant instead of relying on that equivalence holding.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # Nothing is built before the tag name is known to be usable. Three silent failures have
  # come out of this one mechanism:
  #   - an uppercase tag matches no filter and releases nothing, quietly;
  #   - a two-component tag (v1.2) is not semver, so docker/metadata-action emits no
  #     version tag at all and the image ships as `latest` only — which is discovered
  #     months later by someone pulling `:1.2` and getting nothing;
  #   - the tag history drifted (0.0.1, 0.0.2, v0.0.3, v0.1.0, v1.1, v1.2, V1.3).
  # A tag that cannot produce a correct release must fail at second zero, loudly, and say
  # which of those it is.
  guard:
    name: Validate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the tag is a lowercase semver
        id: check
        # `$RELEASE_TAG` vient du `env:` de workflow, exporté dans le shell — pas de
        # contexte `env` à résoudre dans une clé `env:` d'étape, dont la disponibilité
        # dépend de la position.
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^V ]]; then
            echo "::error::tag '$TAG' starts with an uppercase V. Release tags are lowercase — GitHub tag filters are case-sensitive, so this tag would otherwise trigger nothing at all. Re-tag as 'v${TAG#V}'."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a valid semver release tag (expected v<major>.<minor>.<patch>, optionally -prerelease). docker/metadata-action's semver patterns emit no version tag for anything else, so the image would publish as 'latest' with no version behind it."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${TAG#v}"

  build:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 25
    permissions:
      contents: write
      # Both are for the build provenance attestation on the JAR, below. `id-token` mints the
      # short-lived OIDC token Sigstore signs against — there is no key to store or rotate,
      # which is the point — and `attestations` writes the result to this repository.
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache npm downloads
        # Same reasoning as ci.yml: the frontend build runs npm inside Maven, and a
        # warm ~/.npm shields a tag build from a transient registry failure.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            src/main/webapp/node
          key: npm-${{ runner.os }}-${{ hashFiles('src/main/webapp/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # The pom stays at 0.0.1-SNAPSHOT in the repository — that is the development
      # version and nothing should have to bump it to cut a release. But packaging it
      # verbatim meant a Release tagged v1.1 attaching `kafka-sql-explorer-0.0.1-SNAPSHOT.jar`:
      # the one file a user downloads carried no relation to the version they clicked.
      # `versions:set` rewrites the pom in the runner's checkout only, with no backup pom
      # and no commit, so the artefact is named after the tag and the repository is
      # untouched.
      - name: Set the artefact version from the tag
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.guard.outputs.version }} -DgenerateBackupPoms=false

      - name: Build & Test with Maven
        # `verify`, not `package -DskipTests`. A tag can be pushed at any commit, and
        # nothing checked that the commit had ever been green — so a release could ship
        # code no suite had run against. verify produces the same jar and runs the Java
        # suite plus the frontend ESLint/Vitest bound to that phase, and the docker job
        # below inherits the gate through `needs: build`.
        run: ./mvnw -B clean verify -P build-frontend

      # Fails the release rather than publishing one with nothing attached. `mvn verify`
      # going green is not proof that a repackaged JAR exists — a pom or plugin change
      # can leave target/ without one, and the default `if-no-files-found: warn` would
      # have shipped a Release whose only content is its notes.
      - name: Check the JAR and checksum it
        run: |
          set -euo pipefail
          shopt -s nullglob
          # spring-boot:repackage leaves the plain jar as *.jar.original, which this
          # glob does not match — so exactly one file is expected here.
          jars=(target/*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::expected exactly one JAR in target/, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          ( cd target && sha256sum "$(basename "${jars[0]}")" | tee SHA256SUMS.txt )

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

      # The published image carries a full SLSA provenance and an SBOM (see the `docker` job),
      # while the JAR beside it on the same Release had only a checksum — and a checksum
      # published in the same place as the file it describes answers "was this corrupted in
      # transit", never "did this come from here". Anyone who can alter one can alter both.
      #
      # This signs the JAR's digest through Sigstore, keylessly: the signing identity is this
      # workflow, in this repository, at this commit, and it is recorded in a public
      # transparency log. There is no private key anywhere — nothing to store in a secret,
      # nothing to leak, nothing to rotate. That is what makes it maintainable, and it is why
      # this rather than a GPG key whose passphrase would live in the repository settings.
      #
      # Verified by a consumer with:
      #   gh attestation verify kafka-sql-explorer-<version>.jar --repo devdownin/Kafkaexplorer
      - name: Attest the JAR's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/*.jar'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            target/*.jar
            target/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    # `guard` as well as `build`, which changes no ordering — `build` already needs it — and
    # is what makes `needs.guard.outputs.version` readable here. Job outputs are not
    # transitive, and re-deriving the version from the tag in a second place is exactly the
    # duplication that produced the tag defects the guard exists for.
    needs: [guard, build]
    # The image build is now a COPY of an already-built JAR, not a full recompile.
    timeout-minutes: 15
    permissions:
      # `contents: write`, because the digest step appends to the Release notes the `build`
      # job created, and the pin step below pushes a branch. `pull-requests: write` so that
      # branch can be opened as a pull request — neither writes to `main`.
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Not into target/: .dockerignore excludes it, so a JAR downloaded there would be
      # absent from the build context.
      - name: Download JAR artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jar
          path: dist/

      # The image is built from the artefact the `build` job produced and verified,
      # rather than recompiling everything a second time inside Docker. That halves the
      # release and, more importantly, makes the published image contain byte-for-byte
      # the JAR attached to the Release — the previous rebuild could drift from it, and
      # skipped the test gate while doing so.
      - name: Stage the JAR for the runtime image
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::expected exactly one JAR from the build job, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          cp "${jars[0]}" app.jar

      # `Dockerfile` now uses `RUN --mount=type=cache`, which is BuildKit-only. This job
      # builds Dockerfile.release, which does not — but ci.yml builds the other one, and
      # runners defaulting to BuildKit is a default, not a guarantee.
      # Needed by the arm64 half of the multi-arch build below: Dockerfile.release runs a
      # `RUN` (creating the non-root user and its directories), which executes under the
      # target architecture. Without binfmt registered that step fails with "exec format
      # error" on the runner's amd64 kernel.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is an *optional* second registry: a fork, or this repository before the
      # two secrets exist, must still be able to cut a release to GHCR rather than fail on
      # a login it never asked for. The `secrets` context is not available in a job-level
      # `if`, so the decision is taken once here and every Docker Hub step keys off this
      # output. Secrets go through `env` — interpolating them straight into the script
      # would build them into the command line.
      - name: Is Docker Hub configured?
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — publishing to GHCR only."
          fi

      # `continue-on-error`, because the guard above proves only that the two secrets
      # *exist* — never that they work. A present-but-expired token passed that test and
      # then killed the whole job: v1.4.0 went `Logging into ghcr.io... Login Succeeded!`,
      # `Logging into docker.io... unauthorized: incorrect username or password`, and
      # stopped there, before building anything. No image anywhere, while GHCR was
      # authenticated and available. An optional registry must not be able to fail a
      # mandatory one — that is the whole point of the detection above, and checking
      # presence alone did not deliver it.
      - name: Log in to Docker Hub
        id: hub_login
        if: steps.hub.outputs.enabled == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A degraded publish has to be loud. Silence here would mean discovering months later
      # that a tag never reached Docker Hub, which is the class of bug this whole file keeps
      # being bitten by.
      - name: Report a refused Docker Hub login
        if: steps.hub_login.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub login was refused — publishing to GHCR only. The secrets are set (the guard let this step run), so the token itself is being rejected: a read-only or expired PAT, a DOCKERHUB_USERNAME that is not the login account, a password instead of a PAT on a 2FA account, or whitespace in the secret."

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        # Labels are written into each platform's image *config*, and a multi-arch push
        # publishes an image *index* on top of those — which carries none of them. GHCR
        # reads `org.opencontainers.image.source` off the index to link the package back to
        # this repository, and a registry showing "no description" for an image whose
        # metadata is demonstrably set is the symptom. Annotations are the index-level
        # equivalent; `manifest,index` writes both, since which one a registry reads is the
        # registry's business and this image goes to two of them.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Both registries get the same tag set from a single build below — the image is
          # built once and the manifests are pushed to each. Adding a second
          # build-push-action would rebuild it, and two builds can drift.
          # The Docker Hub repository is a variable so a fork publishes under its own
          # namespace without editing this file.
          # Keyed on the login's *outcome*, not on the secrets being present: a skipped
          # login (no secrets) and a refused one (bad token) both leave this name out, so
          # the build below pushes to GHCR alone instead of failing on a registry nobody
          # can reach. `outcome` is the pre-continue-on-error result — `conclusion` would
          # read `success` for a step that just failed.
          # `github.repository` keeps the repository's casing (`devdownin/Kafkaexplorer`)
          # and a container reference must be lowercase — metadata-action normalises it
          # here, which is why this line is correct as written. Anywhere the reference is
          # built by hand it has to be lowercased explicitly; see the `index` step.
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_REPOSITORY || 'compagnonsdudev/kafkaexplorer' }},enable=${{ steps.hub_login.outcome == 'success' }}
          # `latest` was a bare `type=raw`, so it moved on *any* tag: pushing v1.3.0-rc1
          # made a pre-release what `docker run ghcr.io/devdownin/kafkaexplorer` pulls.
          # The guard is the semver pre-release marker — a hyphen in the tag name.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
          # Docker Hub reads these off the manifest for the tag listing, and GHCR uses
          # `image.source` to link the package back to this repository. metadata-action
          # derives source/revision/created on its own; the rest is ours to state.
          # `image.description` below is kept identical to `short-description` in
          # dockerhub-description.yml, which is the same sentence shown in Docker Hub search
          # results — change one and change the other, or the registry contradicts itself.
          # (This has to be a real YAML comment: every line of the block below is parsed as
          # a `name=value` label.)
          labels: |
            org.opencontainers.image.title=Kafka SQL Explorer
            org.opencontainers.image.description=Explore Kafka, query it in Flink SQL, audit it with AI — one container, one URL.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.documentation=https://github.com/devdownin/Kafkaexplorer/blob/main/docs/DOCKERHUB.md

      - name: Build and push Docker image
        # One build, pushed to every registry in `meta.outputs.tags` — GHCR always,
        # Docker Hub when its secrets are configured.
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          # arm64 costs nothing here and there is no cross-compilation involved: the image
          # is a JRE base plus a COPY of an architecture-independent JAR. Without it an
          # Apple Silicon or Graviton host ran the whole JVM under QEMU emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The index-level half of the metadata — see the `env` on the meta step above.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Declared rather than left to buildx's default, which for a multi-platform push
          # attaches attestations either way. What is being chosen here is what they
          # contain, and the cost is visible: an attestation travels as an extra manifest
          # in the index, which Docker Hub and GHCR both render as an `unknown/unknown`
          # platform row next to amd64 and arm64. That row looks like a broken build to
          # anyone reading the tag list, and it is the price of the image being able to say
          # what went into it — a full SLSA provenance and an SBOM, for a JAR whose exact
          # bytes are also attached to the Release. Reversing the trade is `provenance:
          # false` + `sbom: false` on these two lines and nothing else.
          provenance: mode=max
          sbom: true
          # This build had no cache whatsoever: every tag re-pulled both base images and
          # re-ran the runtime stage from zero, the arm64 half of it through QEMU. The
          # scope is shared with ci.yml's `release-image` job, which builds this same
          # Dockerfile on every run — and GitHub lets any ref read the default branch's
          # caches, so a push to main leaves this build warm before the tag is even cut.
          # Read-only on purpose: a release must consume the cache CI maintains, not
          # rewrite it from a ref that builds twice a year.
          cache-from: type=gha,scope=release-image

      # `platforms: linux/amd64,linux/arm64` above is a request, and nothing has ever
      # checked what came back. The overview page promises arm64 runs "natively, not under
      # emulation", so an index that silently shipped one platform would be a claim on a
      # public page with nothing behind it — the same shape as v1.2 shipping a Release JAR
      # with no image behind it. Booting the arm64 variant is ci.yml's job (before a tag
      # exists, where a failure costs nothing); this only asserts it is in the index, which
      # costs one API call.
      - name: Assert both platforms are in the published index
        id: index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Lowercased: a container reference must be, and `github.repository` keeps the
          # GitHub repository's casing — here `devdownin/Kafkaexplorer`, with a capital K.
          # Exported so the release notes below quote a command that actually runs;
          # writing that reference by hand a second time is precisely how they came to
          # publish `ghcr.io/devdownin/Kafkaexplorer@sha256:…`, which docker rejects with
          # "repository name must be lowercase".
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Inspecting $image"
          platforms=$(docker buildx imagetools inspect --raw "$image" \
            | jq -r '.manifests[]
                     | select(.platform.os != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' \
            | sort -u)
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" <<<"$platforms" \
              || { echo "::error::$want is missing from the published image index"; exit 1; }
          done

      # Two things go stale the instant this job publishes, and this is the only moment
      # anything knows a new version exists: the hub stack's Explorer pin, and the changelog's
      # `[Unreleased]` heading. One branch closes both.
      #
      # `compose/spectra-hub.yml` and `compose/image.yml` name the Explorer image by hand
      # (`${EXPLORER_IMAGE_TAG:-<version>}`), because that stack builds nothing and exists to
      # run what is published. Dependabot cannot read a `${VAR:-…}` default, so nothing moves
      # it except a person remembering to — and what happens when nobody does is not that the
      # release notices: it is that the *next* pull request touching a file `hub-changes`
      # gates on fails on `check-image-pins.py --published`, a check about something it did
      # not change. That happened twice in one day, on two unrelated branches.
      #
      # `CHANGELOG.md` had the same shape of hole with none of the alarm. Nothing closed
      # `[Unreleased]` at release time and no check reads it, so entries piled into a section
      # that claimed they had not shipped — thirty releases of them, `v1.7.1` through
      # `v1.9.11`, the file's newest version heading eight weeks behind its newest tag. A
      # stale pin is caught by the next pull request; a stale changelog is caught by nobody,
      # which is exactly why it ran the longer.
      #
      # A pull request rather than a push to `main`: every entry on `main` is a reviewed merge
      # commit, and a bot commit landing straight on the default branch would be neither. It
      # also makes the fix prove itself — the pull request touches the hub files, so
      # `hub-changes` fires and `check-image-pins.py --published` validates the new value
      # against the registry before anyone merges. The mechanism that reports the problem is
      # the one that verifies the correction.
      #
      # Written with `git` and `gh` (both present on the runner) rather than a third-party
      # action: this is the release path, and it already holds `contents: write` and a
      # registry login. One fewer external action with write scope in it is worth ten lines.
      - name: Open a pull request catching the repository up to the release
        # Stable releases only — the same rule that gates `latest`. A pre-release must not
        # move the pin of the stack people actually run, and its entries belong to the stable
        # release that eventually carries them, not to a heading of their own.
        if: ${{ !contains(needs.guard.outputs.version, '-') }}
        # Best-effort, and deliberately so: the image is published by the time this runs. A
        # release must never be reported as failed because a follow-up could not be opened —
        # same posture as the Docker Hub description sync and the cache warming step.
        continue-on-error: true
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a tag push, which has no release payload; the fallback below is then the
          # run's own date, and the two coincide because this job runs on publication.
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          # RELEASE_TAG is not repeated here on purpose: it is the workflow-level `env:`,
          # merged into every step, and restating its expression is the second copy this
          # repository keeps removing. The changelog script below reads it from the
          # environment, so it is named here only to say where it comes from.
        run: |
          set -euo pipefail
          # Branch from the current default branch, not from the tagged commit: the tag may
          # be behind by the time this runs, and a pull request whose base has moved shows a
          # diff nobody asked for.
          git fetch --depth 1 origin "$DEFAULT_BRANCH"
          git switch -c "chore/release-followup-${VERSION}" FETCH_HEAD

          release_date="${PUBLISHED_AT:0:10}"
          [ -n "$release_date" ] || release_date="$(date -u +%F)"
          export RELEASE_DATE="$release_date"

          # Both halves move together, as the check's own message says. Edited in Python
          # rather than sed: the pattern contains `${…}`, and getting one layer of shell
          # quoting wrong there yields a file that still parses and names the wrong image.
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          # Every compose file that carries the pin, not one named by hand. Two do now —
          # compose/spectra-hub.yml and compose/image.yml — and docs/check-image-pins.py
          # asserts they agree, so a bump applied to only one fails the next pull request
          # instead of quietly pairing an old Explorer with a current everything-else.
          # Discovered rather than listed, so a third file needs no edit here.
          # `carried` and `bumped` are counted apart, and the difference is the whole point:
          # a file that carries the pin and already names this version is a re-run, which is
          # normal and must fall through to the "nothing to open" exit below. Only *nobody*
          # carrying the pattern means it was renamed. Conflating the two — raising whenever
          # nothing changed — made a re-published release die on "has it been renamed?", a
          # confident wrong sentence about a tree that is perfectly correct, and it now takes
          # the changelog down with it rather than just the pin.
          carried, bumped = [], []
          for compose in [pathlib.Path("docker-compose.yml"),
                          *sorted(pathlib.Path("compose").glob("*.yml"))]:
              before = compose.read_text()
              after, hits = re.subn(
                  r"(kafkaexplorer:\$\{EXPLORER_IMAGE_TAG:-)[^}]+(\})",
                  lambda m: m.group(1) + version + m.group(2),
                  before)
              if hits:
                  carried.append(str(compose))
                  if after != before:
                      compose.write_text(after)
                      bumped.append(str(compose))
          if not carried:
              raise SystemExit("no compose file carries the Explorer pin — has it been renamed?")
          print("bumped: " + (", ".join(bumped) if bumped
                              else f"none — every pin already names {version}"))
          env = pathlib.Path(".env.example")
          env.write_text(re.sub(
              r"(?m)^EXPLORER_IMAGE_TAG=.*$", f"EXPLORER_IMAGE_TAG={version}", env.read_text()))
          PY

          # The changelog is closed in its own process, and a failure here is reported without
          # taking the pin bump down with it: the pin is what decides which image people run,
          # so a changelog whose shape has drifted must not be able to block it. The `::error::`
          # at the end of the step is what keeps that from being a silence.
          changelog_ok=1
          python3 - <<'PY' || changelog_ok=0
          import os, pathlib, re, sys
          version, tag = os.environ["VERSION"], os.environ["RELEASE_TAG"]
          date = os.environ["RELEASE_DATE"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          # Idempotent: a re-run, or a release whose changelog was closed by hand, changes
          # nothing rather than filing the version twice.
          if re.search(rf"(?m)^## \[{re.escape(version)}\]", text):
              print(f"CHANGELOG.md already carries a [{version}] section — nothing to close.")
              sys.exit(0)

          lines = text.split("\n")
          head = next((i for i, l in enumerate(lines) if l.startswith("## [Unreleased]")), None)
          if head is None:
              sys.exit("CHANGELOG.md has no '## [Unreleased]' heading to close.")
          end = next((i for i in range(head + 1, len(lines))
                      if lines[i].startswith("## [")), len(lines))

          if any(l.startswith("- ") for l in lines[head + 1:end]):
              # Rename the section to the version, and open an empty one above it.
              lines[head] = f"## [{version}] — {date}"
              lines[head:head] = ["## [Unreleased]", "", "Nothing yet.", ""]
              print(f"closed [Unreleased] as [{version}]")
          else:
              # A release that recorded nothing still gets a heading: an absent version reads
              # as a lost one. Same wording the reconstructed sections use.
              notes = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                       f"/releases/tag/{tag}")
              lines[end:end] = [f"## [{version}] — {date}", "",
                                "Released from `main` with no entry recorded here; see "
                                f"[the release notes]({notes}).", ""]
              print(f"[Unreleased] was empty — filed [{version}] as a release with no entry")

          text = "\n".join(lines)

          # The link references at the foot carry the previous tag already, so the comparison
          # links are derived from the file rather than from `git describe` — which would need
          # the tag history this shallow clone deliberately does not fetch.
          ref = re.search(
              r"(?m)^\[Unreleased\]: (?P<base>\S+)/compare/(?P<prev>\S+?)\.\.\.HEAD[ \t]*$", text)
          if ref is None:
              sys.exit("CHANGELOG.md has no '[Unreleased]: …/compare/<tag>...HEAD' reference to move.")
          if ref.group("prev") != tag:
              text = (text[:ref.start()]
                      + f"[Unreleased]: {ref.group('base')}/compare/{tag}...HEAD\n"
                      + f"[{version}]: {ref.group('base')}/compare/{ref.group('prev')}...{tag}"
                      + text[ref.end():])
          path.write_text(text)
          PY

          if git diff --quiet; then
            echo "Nothing to open — the pin and the changelog both already name ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Catch the repository up to ${VERSION}: stack pin and changelog"
          git push -u origin "chore/release-followup-${VERSION}"

          if ! gh pr create \
            --base "$DEFAULT_BRANCH" \
            --title "Catch the repository up to ${VERSION}" \
            --body "$(printf '%s\n' \
              "\`v${VERSION}\` is published. Two files in the tree still describe the release before it, and this is the only moment anything knows the new one exists." \
              "" \
              "**The stack pin.** \`compose/spectra-hub.yml\`, \`compose/image.yml\` and \`.env.example\` named a release behind — the hub stack builds nothing and pulls what is published, so it would pair an old Explorer with a current SpectraLLM. The hand-written \`\${EXPLORER_IMAGE_TAG:-…}\` default is invisible to Dependabot, and left alone it is discovered by the next unrelated pull request failing \`check-image-pins.py --published\`." \
              "" \
              "**The changelog.** \`[Unreleased]\` is closed as \`[${VERSION}]\` and a fresh empty section opened above it, with the comparison links moved to match. Nothing else does this, and nothing checks it: that is how thirty releases came to sit in a section claiming they had not shipped." \
              "" \
              "This pull request touches the hub files, so \`hub-changes\` runs \`spectra-hub-stack\` and the new pin is checked against the registry here before it is merged." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            # `::error::` and a non-zero exit, not a warning that lets the step report success.
            #
            # Measured, on v1.9.10: this step came back **green in four seconds** having created
            # no pull request at all — the branch was pushed, `gh pr create` was refused, and the
            # `if !` swallowed it. Nobody opens a run whose steps are all green, so the warning
            # was written to a place no one looks; `chore/bump-explorer-pin-1.9.5` is the same
            # fingerprint from four days earlier. The pin then rots until an unrelated pull
            # request fails `check-image-pins.py --published` on something it did not touch,
            # which is how #340 came to exist and how `main` came to be red.
            #
            # `continue-on-error: true` above is what makes this safe and is deliberately kept:
            # the image is already published when this runs, so the *job* still succeeds and the
            # release is never reported as failed. What changes is only that the step stops
            # claiming it did something it did not do — the repository's own rule, that a
            # measurement which could not be taken is not a zero, applied to a step's own verdict.
            echo "::error::The release follow-up branch was pushed but no pull request could be opened. If this is a permission refusal, enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'; the branch chore/release-followup-${VERSION} is there and can be opened by hand."
            exit 1
          fi

          if [ "$changelog_ok" -eq 0 ]; then
            # The pull request is open with the pin bump in it, so the release is caught up on
            # the half that decides which image people run. This says the other half was not,
            # rather than letting a green step imply it was.
            echo "::error::The Explorer pin was bumped and the pull request opened, but CHANGELOG.md could not be closed — see the Python failure above. Close [Unreleased] as [${VERSION}] by hand on chore/release-followup-${VERSION}; CONTRIBUTING.md documents the three steps."
            exit 1
          fi

      # The Release carries SHA256SUMS.txt for the JAR, so the one file a user downloads can
      # be verified — while the image, the artefact most people actually consume, offered
      # nothing to pin. A tag is mutable (nothing re-pushes one here, but that is a promise,
      # not a property); the digest is the only immutable reference, and docs/DOCKERHUB.md
      # points at these notes for it.
      - name: Append the image digest to the Release notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          append_body: true
          body: |

            ---

            **Container image** — `${{ steps.build.outputs.digest }}`

            ```bash
            docker pull ${{ steps.index.outputs.image }}
            ```

            Same digest on every registry this tag was pushed to. Pin it in production:
            a tag can be moved, a digest cannot.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
