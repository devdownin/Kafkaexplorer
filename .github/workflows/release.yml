name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache npm downloads
        # Same reasoning as ci.yml: the frontend build runs npm inside Maven, and a
        # warm ~/.npm shields a tag build from a transient registry failure.
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            src/main/webapp/node
          key: npm-${{ runner.os }}-${{ hashFiles('src/main/webapp/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build & Test with Maven
        # `verify`, not `package -DskipTests`. A tag can be pushed at any commit, and
        # nothing checked that the commit had ever been green — so a release could ship
        # code no suite had run against. verify produces the same jar and runs the Java
        # suite plus the frontend ESLint/Vitest bound to that phase, and the docker job
        # below inherits the gate through `needs: build`.
        run: ./mvnw -B clean verify -P build-frontend

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
