name: Create Release

on:
  push:
    tags:
      # `V*` is here so an uppercase tag reaches the guard below and is *refused*, rather
      # than matching nothing and silently releasing nothing. Tag filters are
      # case-sensitive, and `V1.3` did exactly that: the tag existed, a Release was created
      # by hand, and no workflow ever ran — with no signal anywhere that it hadn't.
      - 'v*'
      - 'V*'

jobs:
  # Nothing is built before the tag name is known to be usable. Three silent failures have
  # come out of this one mechanism:
  #   - an uppercase tag matches no filter and releases nothing, quietly;
  #   - a two-component tag (v1.2) is not semver, so docker/metadata-action emits no
  #     version tag at all and the image ships as `latest` only — which is discovered
  #     months later by someone pulling `:1.2` and getting nothing;
  #   - the tag history drifted (0.0.1, 0.0.2, v0.0.3, v0.1.0, v1.1, v1.2, V1.3).
  # A tag that cannot produce a correct release must fail at second zero, loudly, and say
  # which of those it is.
  guard:
    name: Validate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the tag is a lowercase semver
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^V ]]; then
            echo "::error::tag '$TAG' starts with an uppercase V. Release tags are lowercase — GitHub tag filters are case-sensitive, so this tag would otherwise trigger nothing at all. Re-tag as 'v${TAG#V}'."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a valid semver release tag (expected v<major>.<minor>.<patch>, optionally -prerelease). docker/metadata-action's semver patterns emit no version tag for anything else, so the image would publish as 'latest' with no version behind it."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${TAG#v}"

  build:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache npm downloads
        # Same reasoning as ci.yml: the frontend build runs npm inside Maven, and a
        # warm ~/.npm shields a tag build from a transient registry failure.
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            src/main/webapp/node
          key: npm-${{ runner.os }}-${{ hashFiles('src/main/webapp/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # The pom stays at 0.0.1-SNAPSHOT in the repository — that is the development
      # version and nothing should have to bump it to cut a release. But packaging it
      # verbatim meant a Release tagged v1.1 attaching `kafka-sql-explorer-0.0.1-SNAPSHOT.jar`:
      # the one file a user downloads carried no relation to the version they clicked.
      # `versions:set` rewrites the pom in the runner's checkout only, with no backup pom
      # and no commit, so the artefact is named after the tag and the repository is
      # untouched.
      - name: Set the artefact version from the tag
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.guard.outputs.version }} -DgenerateBackupPoms=false

      - name: Build & Test with Maven
        # `verify`, not `package -DskipTests`. A tag can be pushed at any commit, and
        # nothing checked that the commit had ever been green — so a release could ship
        # code no suite had run against. verify produces the same jar and runs the Java
        # suite plus the frontend ESLint/Vitest bound to that phase, and the docker job
        # below inherits the gate through `needs: build`.
        run: ./mvnw -B clean verify -P build-frontend

      # Fails the release rather than publishing one with nothing attached. `mvn verify`
      # going green is not proof that a repackaged JAR exists — a pom or plugin change
      # can leave target/ without one, and the default `if-no-files-found: warn` would
      # have shipped a Release whose only content is its notes.
      - name: Check the JAR and checksum it
        run: |
          set -euo pipefail
          shopt -s nullglob
          # spring-boot:repackage leaves the plain jar as *.jar.original, which this
          # glob does not match — so exactly one file is expected here.
          jars=(target/*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::expected exactly one JAR in target/, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          ( cd target && sha256sum "$(basename "${jars[0]}")" | tee SHA256SUMS.txt )

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/*.jar
            target/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: build
    # The image build is now a COPY of an already-built JAR, not a full recompile.
    timeout-minutes: 15
    permissions:
      # `write`, because the last step appends the published digest to the Release notes
      # the `build` job created. Nothing else here writes to the repository.
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Not into target/: .dockerignore excludes it, so a JAR downloaded there would be
      # absent from the build context.
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist/

      # The image is built from the artefact the `build` job produced and verified,
      # rather than recompiling everything a second time inside Docker. That halves the
      # release and, more importantly, makes the published image contain byte-for-byte
      # the JAR attached to the Release — the previous rebuild could drift from it, and
      # skipped the test gate while doing so.
      - name: Stage the JAR for the runtime image
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::expected exactly one JAR from the build job, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          cp "${jars[0]}" app.jar

      # `Dockerfile` now uses `RUN --mount=type=cache`, which is BuildKit-only. This job
      # builds Dockerfile.release, which does not — but ci.yml builds the other one, and
      # runners defaulting to BuildKit is a default, not a guarantee.
      # Needed by the arm64 half of the multi-arch build below: Dockerfile.release runs a
      # `RUN` (creating the non-root user and its directories), which executes under the
      # target architecture. Without binfmt registered that step fails with "exec format
      # error" on the runner's amd64 kernel.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is an *optional* second registry: a fork, or this repository before the
      # two secrets exist, must still be able to cut a release to GHCR rather than fail on
      # a login it never asked for. The `secrets` context is not available in a job-level
      # `if`, so the decision is taken once here and every Docker Hub step keys off this
      # output. Secrets go through `env` — interpolating them straight into the script
      # would build them into the command line.
      - name: Is Docker Hub configured?
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — publishing to GHCR only."
          fi

      # `continue-on-error`, because the guard above proves only that the two secrets
      # *exist* — never that they work. A present-but-expired token passed that test and
      # then killed the whole job: v1.4.0 went `Logging into ghcr.io... Login Succeeded!`,
      # `Logging into docker.io... unauthorized: incorrect username or password`, and
      # stopped there, before building anything. No image anywhere, while GHCR was
      # authenticated and available. An optional registry must not be able to fail a
      # mandatory one — that is the whole point of the detection above, and checking
      # presence alone did not deliver it.
      - name: Log in to Docker Hub
        id: hub_login
        if: steps.hub.outputs.enabled == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A degraded publish has to be loud. Silence here would mean discovering months later
      # that a tag never reached Docker Hub, which is the class of bug this whole file keeps
      # being bitten by.
      - name: Report a refused Docker Hub login
        if: steps.hub_login.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub login was refused — publishing to GHCR only. The secrets are set (the guard let this step run), so the token itself is being rejected: a read-only or expired PAT, a DOCKERHUB_USERNAME that is not the login account, a password instead of a PAT on a 2FA account, or whitespace in the secret."

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        # Labels are written into each platform's image *config*, and a multi-arch push
        # publishes an image *index* on top of those — which carries none of them. GHCR
        # reads `org.opencontainers.image.source` off the index to link the package back to
        # this repository, and a registry showing "no description" for an image whose
        # metadata is demonstrably set is the symptom. Annotations are the index-level
        # equivalent; `manifest,index` writes both, since which one a registry reads is the
        # registry's business and this image goes to two of them.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Both registries get the same tag set from a single build below — the image is
          # built once and the manifests are pushed to each. Adding a second
          # build-push-action would rebuild it, and two builds can drift.
          # The Docker Hub repository is a variable so a fork publishes under its own
          # namespace without editing this file.
          # Keyed on the login's *outcome*, not on the secrets being present: a skipped
          # login (no secrets) and a refused one (bad token) both leave this name out, so
          # the build below pushes to GHCR alone instead of failing on a registry nobody
          # can reach. `outcome` is the pre-continue-on-error result — `conclusion` would
          # read `success` for a step that just failed.
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_REPOSITORY || 'compagnonsdudev/kafkaexplorer' }},enable=${{ steps.hub_login.outcome == 'success' }}
          # `latest` was a bare `type=raw`, so it moved on *any* tag: pushing v1.3.0-rc1
          # made a pre-release what `docker run ghcr.io/devdownin/kafkaexplorer` pulls.
          # The guard is the semver pre-release marker — a hyphen in the tag name.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          # Docker Hub reads these off the manifest for the tag listing, and GHCR uses
          # `image.source` to link the package back to this repository. metadata-action
          # derives source/revision/created on its own; the rest is ours to state.
          # `image.description` below is kept identical to `short-description` in
          # dockerhub-description.yml, which is the same sentence shown in Docker Hub search
          # results — change one and change the other, or the registry contradicts itself.
          # (This has to be a real YAML comment: every line of the block below is parsed as
          # a `name=value` label.)
          labels: |
            org.opencontainers.image.title=Kafka SQL Explorer
            org.opencontainers.image.description=Explore Kafka, query it in Flink SQL, audit it with AI — one container, one URL.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.documentation=https://github.com/devdownin/Kafkaexplorer/blob/main/docs/DOCKERHUB.md

      - name: Build and push Docker image
        # One build, pushed to every registry in `meta.outputs.tags` — GHCR always,
        # Docker Hub when its secrets are configured.
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          # arm64 costs nothing here and there is no cross-compilation involved: the image
          # is a JRE base plus a COPY of an architecture-independent JAR. Without it an
          # Apple Silicon or Graviton host ran the whole JVM under QEMU emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The index-level half of the metadata — see the `env` on the meta step above.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Declared rather than left to buildx's default, which for a multi-platform push
          # attaches attestations either way. What is being chosen here is what they
          # contain, and the cost is visible: an attestation travels as an extra manifest
          # in the index, which Docker Hub and GHCR both render as an `unknown/unknown`
          # platform row next to amd64 and arm64. That row looks like a broken build to
          # anyone reading the tag list, and it is the price of the image being able to say
          # what went into it — a full SLSA provenance and an SBOM, for a JAR whose exact
          # bytes are also attached to the Release. Reversing the trade is `provenance:
          # false` + `sbom: false` on these two lines and nothing else.
          provenance: mode=max
          sbom: true
          # This build had no cache whatsoever: every tag re-pulled both base images and
          # re-ran the runtime stage from zero, the arm64 half of it through QEMU. The
          # scope is shared with ci.yml's `release-image` job, which builds this same
          # Dockerfile on every run — and GitHub lets any ref read the default branch's
          # caches, so a push to main leaves this build warm before the tag is even cut.
          # Read-only on purpose: a release must consume the cache CI maintains, not
          # rewrite it from a ref that builds twice a year.
          cache-from: type=gha,scope=release-image

      # `platforms: linux/amd64,linux/arm64` above is a request, and nothing has ever
      # checked what came back. The overview page promises arm64 runs "natively, not under
      # emulation", so an index that silently shipped one platform would be a claim on a
      # public page with nothing behind it — the same shape as v1.2 shipping a Release JAR
      # with no image behind it. Booting the arm64 variant is ci.yml's job (before a tag
      # exists, where a failure costs nothing); this only asserts it is in the index, which
      # costs one API call.
      - name: Assert both platforms are in the published index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "Inspecting $image"
          platforms=$(docker buildx imagetools inspect --raw "$image" \
            | jq -r '.manifests[]
                     | select(.platform.os != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' \
            | sort -u)
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" <<<"$platforms" \
              || { echo "::error::$want is missing from the published image index"; exit 1; }
          done

      # The Release carries SHA256SUMS.txt for the JAR, so the one file a user downloads can
      # be verified — while the image, the artefact most people actually consume, offered
      # nothing to pin. A tag is mutable (nothing re-pushes one here, but that is a promise,
      # not a property); the digest is the only immutable reference, and docs/DOCKERHUB.md
      # points at these notes for it.
      - name: Append the image digest to the Release notes
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          body: |

            ---

            **Container image** — `${{ steps.build.outputs.digest }}`

            ```bash
            docker pull ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
            ```

            Same digest on every registry this tag was pushed to. Pin it in production:
            a tag can be moved, a digest cannot.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
