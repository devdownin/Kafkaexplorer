name: CI & Deployment

# `push` is deliberately limited to main. Listing feature branches here as well
# built every pushed commit twice once its pull request existed: the push and the
# pull_request event both fired, and the concurrency guard below cannot collapse
# them because `github.ref` differs between the two (refs/heads/<branch> against
# refs/pull/<n>/merge), putting them in separate groups. Branch work is covered by
# its pull request; use workflow_dispatch to build a branch before opening one.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Scoped per ref so pull requests build in parallel instead of queueing behind
# each other; a superseded push to the same one is cancelled. The Pages
# deployment keeps its own dedicated group on the deploy job, since GitHub allows
# only one concurrent Pages deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite finishes in ~2 minutes. Without a cap, a wedged Flink test or a
    # container that never becomes healthy runs into GitHub's 360-minute default.
    timeout-minutes: 20

    # No Kafka service container: nothing in the suite connects to localhost:9092.
    # The one test that does exercise a real broker, KafkaClusterIntegrationTest,
    # starts its own through Testcontainers (`@Testcontainers(disabledWithoutDocker
    # = true)`) and reads KAFKA.getBootstrapServers(), so a service on 9092 served
    # no test while costing an image pull and a boot on every run. The whole suite
    # passes with no broker reachable at all. If a future test does need one, prefer
    # a Testcontainers container in that test over a workflow-wide service — it then
    # also works on a developer machine.

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Cache npm downloads
      # The frontend build runs `npm install` inside Maven (frontend-maven-plugin);
      # a warm ~/.npm serves the package tarballs locally and shields the build
      # from transient registry failures (an npm ECONNRESET broke a previous run).
      # src/main/webapp/node is the node/npm runtime the plugin downloads.
      uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          src/main/webapp/node
        key: npm-${{ runner.os }}-${{ hashFiles('src/main/webapp/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    - name: Build & Test with Maven
      # verify runs the full lifecycle including tests — no separate `mvn test`
      # pass (the previous package + test combo ran the whole suite twice).
      # The frontend ESLint and Vitest runs are bound to this phase too.
      run: ./mvnw -B verify -P build-frontend --file pom.xml

    - name: Upload test reports
      # Only on failure, and this is the point: a build that is green locally but red
      # here (CI resolves the real io.confluent jars, the local offline harness uses
      # stubs) was otherwise diagnosable only by scrolling the raw log.
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: target/surefire-reports/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload JAR
      # Consumed by the `release-image` job below, so Dockerfile.release is exercised on
      # every run rather than for the first time at tag time.
      uses: actions/upload-artifact@v7
      with:
        name: jar
        path: target/*.jar
        retention-days: 1
        if-no-files-found: error

  # Nothing here ever built the image, so a broken Dockerfile stayed invisible until a
  # tag was pushed — which is exactly how it went: `vite.config.ts` gained
  # `build.outDir: '../resources/static'`, the frontend stage stopped producing
  # /app/dist, main stayed green, and v1.2 shipped a Release JAR with no GHCR image
  # behind it. This is the cheapest place to catch that, and it is the image the
  # README's one-command quick start builds.
  #
  # Deliberately not `needs: build`: it runs in parallel, so it costs wall-clock time
  # only if it is the slowest job. It never pushes — publishing stays release.yml's job.
  #
  # Building it is not enough, either: a deployment can build perfectly and still be
  # broken. Three bugs lived in these files for months because nothing ever *ran* them —
  # a bind-mounted log file that Docker turned into a directory (so file logging was
  # dead), an app gated behind the demo seeding (so the UI was unreachable for minutes),
  # and a stop grace period shorter than the shutdown it had to cover. Each assertion in
  # the smoke test below corresponds to one of them.
  docker:
    name: Build image and smoke-test the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by every `docker compose` invocation in this job, so the overlay does not
      # have to be repeated on each line.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Into the runner's daemon, so the compose overlay can run this exact image.
          load: true
          tags: kafka-sql-explorer:ci
          # Scoped per Dockerfile. `type=gha` defaults to a single shared scope, so this
          # from-source build and the release image below — two unrelated layer sets, one
          # of them carrying the Maven repository and node_modules — were rewriting the
          # same cache manifest in turn, each `mode=max` export invalidating the other's.
          # `mode=max` is right here and only here: the expensive layers are the builder
          # stages (npm ci, dependency:go-offline, mvn package), which `mode=min` would
          # not keep at all.
          cache-from: type=gha,scope=source-image
          cache-to: type=gha,mode=max,scope=source-image

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Wait for the app to report healthy
        # The image's own HEALTHCHECK decides, so this also tests the healthcheck.
        # The container is resolved through compose, not by a fixed name: the stacks
        # carry no `container_name` any more, precisely so two of them can coexist.
        run: |
          set -euo pipefail
          explorer=$(docker compose ps -q explorer)
          [ -n "$explorer" ] || { echo "::error::no explorer container"; exit 1; }
          echo "EXPLORER_CID=$explorer" >> "$GITHUB_ENV"
          for _ in $(seq 1 72); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$explorer" 2>/dev/null || echo missing)
            case "$status" in
              healthy)   echo "healthy"; exit 0 ;;
              unhealthy) echo "::error::the container reported unhealthy"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::the app never became healthy"
          exit 1

      - name: Assert the deployment contract
        run: |
          set -euo pipefail
          # Serves, and separately: can reach the broker. readiness carries the Kafka
          # indicator, liveness does not — that split is the point.
          curl -fsS http://127.0.0.1:8080/actuator/health/liveness  | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/api/dashboard > /dev/null

          # Runs unprivileged.
          uid=$(docker compose exec -T explorer id -u | tr -d '[:space:]')
          [ "$uid" = "10001" ] || { echo "::error::running as uid $uid, expected 10001"; exit 1; }

          # File logging actually produces a file. Mounting a *file* that did not exist on
          # the host made Docker create a directory here, and Logback failed silently.
          docker compose exec -T explorer sh -c 'test -s /app/logs/kafkaexplorer.log' \
            || { echo "::error::no log file written"; exit 1; }

      - name: Wait for the demo seeding, then assert it is idempotent
        run: |
          set -euo pipefail
          seeder=$(docker compose ps -aq demo-setup)
          for _ in $(seq 1 72); do
            [ "$(docker inspect -f '{{.State.Status}}' "$seeder")" = exited ] && break
            sleep 5
          done
          code=$(docker inspect -f '{{.State.ExitCode}}' "$seeder")
          [ "$code" = "0" ] || { docker logs "$seeder" | tail -50; echo "::error::seeder exited $code"; exit 1; }

          # A second run must skip: Kafka data outlives `down`, and re-seeding adds a
          # generation of duplicates to a dataset calibrated to report a known value.
          docker compose run --rm --no-deps demo-setup 2>&1 | tee /tmp/reseed.log
          grep -q "already present" /tmp/reseed.log \
            || { echo "::error::the seeder re-seeded an already-seeded cluster"; exit 1; }

      - name: Stop the stack and assert a clean shutdown
        run: |
          set -euo pipefail
          docker compose stop
          code=$(docker inspect -f '{{.State.ExitCode}}' "$EXPLORER_CID")
          # 0, or 143 = 128+SIGTERM for a JVM that ran its shutdown hooks. 137 is
          # 128+SIGKILL: the grace period expired mid-shutdown, which is the failure this
          # whole `stop_grace_period` / graceful-shutdown pairing exists to prevent.
          case "$code" in
            0|143) echo "clean exit ($code)" ;;
            *)     echo "::error::explorer exited $code (137 means it was SIGKILLed)"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  # Dockerfile.release is what a tag actually publishes, and until now nothing built it
  # outside release.yml — so a change to it (the layered extraction, for one) was first
  # exercised by the release itself. It is cheap here: the JAR already exists.
  release-image:
    name: Build and boot the release image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist/
      - name: Stage the JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          [ ${#jars[@]} -eq 1 ] || { echo "::error::expected one JAR, found ${#jars[@]}"; exit 1; }
          cp "${jars[0]}" app.jar
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the release image
        # Was a bare `docker build`, which runs on the default `docker` driver and can
        # therefore use no exportable cache at all — this was the one image in the whole
        # repository built cold every single time. Through Buildx it shares a cache scope
        # with the identical build release.yml runs on a tag; GitHub makes the default
        # branch's caches readable from every other ref, so a push to main warms exactly
        # what the next release consumes, including the runtime stage's `RUN adduser`,
        # which release.yml would otherwise re-run under QEMU for the arm64 variant.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: false
          # Into the runner's daemon — the next step boots this exact image.
          load: true
          tags: kafka-explorer-release:ci
          # `mode=min`, unlike the from-source build above: this Dockerfile has no
          # expensive intermediate stage, and its one builder step (the layer extraction)
          # is invalidated by every new JAR anyway. What is worth keeping is the final
          # image's stable layers, which is precisely what min exports.
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=min,scope=release-image
      - name: Boot it
        # No broker: the app must still start and answer liveness. Readiness is expected
        # to be DOWN here, which is precisely what makes the split worth having.
        run: |
          set -euo pipefail
          docker run -d --name release-probe -p 127.0.0.1:8080:8080 kafka-explorer-release:ci
          for _ in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/liveness 2>/dev/null | grep -q '"status":"UP"'; then
              uid=$(docker exec release-probe id -u | tr -d '[:space:]')
              [ "$uid" = "10001" ] || { echo "::error::release image runs as uid $uid"; exit 1; }
              docker rm -f release-probe
              exit 0
            fi
            sleep 5
          done
          docker logs release-probe | tail -100
          echo "::error::the release image never answered liveness"
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
