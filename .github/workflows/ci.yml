name: CI & Deployment

# `push` is deliberately limited to main. Listing feature branches here as well
# built every pushed commit twice once its pull request existed: the push and the
# pull_request event both fired, and the concurrency guard below cannot collapse
# them because `github.ref` differs between the two (refs/heads/<branch> against
# refs/pull/<n>/merge), putting them in separate groups. Branch work is covered by
# its pull request; use workflow_dispatch to build a branch before opening one.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Scoped per ref so pull requests build in parallel instead of queueing behind
# each other; a superseded push to the same one is cancelled. The Pages
# deployment keeps its own dedicated group on the deploy job, since GitHub allows
# only one concurrent Pages deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite finishes in ~2 minutes. Without a cap, a wedged Flink test or a
    # container that never becomes healthy runs into GitHub's 360-minute default.
    timeout-minutes: 20

    # No Kafka service container: nothing in the suite connects to localhost:9092.
    # The one test that does exercise a real broker, KafkaClusterIntegrationTest,
    # starts its own through Testcontainers (`@Testcontainers(disabledWithoutDocker
    # = true)`) and reads KAFKA.getBootstrapServers(), so a service on 9092 served
    # no test while costing an image pull and a boot on every run. The whole suite
    # passes with no broker reachable at all. If a future test does need one, prefer
    # a Testcontainers container in that test over a workflow-wide service — it then
    # also works on a developer machine.

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Cache npm downloads
      # The frontend build runs `npm install` inside Maven (frontend-maven-plugin);
      # a warm ~/.npm serves the package tarballs locally and shields the build
      # from transient registry failures (an npm ECONNRESET broke a previous run).
      # src/main/webapp/node is the node/npm runtime the plugin downloads.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.npm
          src/main/webapp/node
        key: npm-${{ runner.os }}-${{ hashFiles('src/main/webapp/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    # KafkaClusterIntegrationTest pulls apache/kafka-native and testcontainers/ryuk from
    # Docker Hub, anonymously, from a shared runner IP — and anonymous pulls are rate-limited
    # per IP over a time window. `Container startup failed for image apache/kafka-native:4.3.1`
    # failed this job three times in thirteen hours, twice on a pull request and once on a push
    # to main, and the third time it failed with `withStartupAttempts(2)` already in place: an
    # immediate retry inside the same window is exactly what a rate limit does not forgive,
    # which is the shape of evidence that pointed here. Authenticating raises the limit.
    #
    # This is a hypothesis, not a proven cause — the Testcontainers exception naming the reason
    # sat above the tail GitHub's log API serves, which `src/test/resources/logback-test.xml`
    # now fixes. Either way the step costs nothing and cannot regress anything: same guard as
    # release.yml, so a fork without the secrets simply skips it, and `continue-on-error` keeps
    # a refused login from failing a build that never needed the login to begin with.
    - name: Is Docker Hub configured?
      id: hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        set -euo pipefail
        if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
        else
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — Testcontainers will pull anonymously, subject to Docker Hub's per-IP rate limit."
        fi

    - name: Log in to Docker Hub for Testcontainers pulls
      id: hub_login
      if: steps.hub.outputs.enabled == 'true'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Report a refused Docker Hub login
      if: steps.hub_login.outcome == 'failure'
      run: |
        echo "::warning::Docker Hub login was refused — Testcontainers will pull anonymously. The secrets are set (the guard let this step run), so the token itself is being rejected: a read-only or expired PAT, a DOCKERHUB_USERNAME that is not the login account, a password instead of a PAT on a 2FA account, or whitespace in the secret."

    - name: Pull the Testcontainers broker image
      # KafkaClusterIntegrationTest starts a broker through Testcontainers, and a launch that
      # fails is not a test that failed — it takes the whole `verify` down with this class's
      # assertions never having run, which has now happened three times on hosted runners. Pulling
      # here separates the two failures that used to arrive as one: a registry that cannot be
      # reached fails *this* step, named for what it is, while the suite below then starts from a
      # local image. `continue-on-error` because it is a warm-up, not a gate — Testcontainers
      # pulls for itself if this did not, and a build must not fail on a step whose only job is to
      # make a later one faster.
      continue-on-error: true
      run: docker pull apache/kafka-native:4.3.1

    - name: Build & Test with Maven
      # verify runs the full lifecycle including tests — no separate `mvn test`
      # pass (the previous package + test combo ran the whole suite twice).
      # The frontend ESLint and Vitest runs are bound to this phase too.
      run: ./mvnw -B verify -P build-frontend --file pom.xml

    - name: Upload test reports
      # Only on failure, and this is the point: a build that is green locally but red
      # here (CI resolves the real io.confluent jars, the local offline harness uses
      # stubs) was otherwise diagnosable only by scrolling the raw log.
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-reports
        path: target/surefire-reports/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload JAR
      # Consumed by the `release-image` job below, so Dockerfile.release is exercised on
      # every run rather than for the first time at tag time.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: jar
        path: target/*.jar
        retention-days: 1
        if-no-files-found: error

  # Nothing here ever built the image, so a broken Dockerfile stayed invisible until a
  # tag was pushed — which is exactly how it went: `vite.config.ts` gained
  # `build.outDir: '../resources/static'`, the frontend stage stopped producing
  # /app/dist, main stayed green, and v1.2 shipped a Release JAR with no GHCR image
  # behind it. This is the cheapest place to catch that, and it is the image the
  # README's one-command quick start builds.
  #
  # Deliberately not `needs: build`: it runs in parallel, so it costs wall-clock time
  # only if it is the slowest job. It never pushes — publishing stays release.yml's job.
  #
  # Building it is not enough, either: a deployment can build perfectly and still be
  # broken. Three bugs lived in these files for months because nothing ever *ran* them —
  # a bind-mounted log file that Docker turned into a directory (so file logging was
  # dead), an app gated behind the demo seeding (so the UI was unreachable for minutes),
  # and a stop grace period shorter than the shutdown it had to cover. Each assertion in
  # the smoke test below corresponds to one of them.
  docker:
    name: Build image and smoke-test the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by every `docker compose` invocation in this job, so the chain does not have
      # to be repeated on each line. `compose/image.yml` sits in the middle deliberately:
      # it is the overlay a user runs to start the stack from the published image, and it
      # carries the `build: !reset null` that makes an `up` pull rather than compile. CI
      # then overrides only the image name (a tag that exists in this runner's daemon).
      # Before, that reset lived nowhere and the job leaned on `--no-build`; now the file
      # real deployments use is exercised on every run instead of only by compose-lint.
      COMPOSE_FILE: docker-compose.yml:compose/image.yml:compose/ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image from source
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          # Into the runner's daemon, so the compose overlay can run this exact image.
          load: true
          tags: kafka-sql-explorer:ci
          # Scoped per Dockerfile. `type=gha` defaults to a single shared scope, so this
          # from-source build and the release image below — two unrelated layer sets, one
          # of them carrying the Maven repository and node_modules — were rewriting the
          # same cache manifest in turn, each `mode=max` export invalidating the other's.
          # `mode=max` is right here and only here: the expensive layers are the builder
          # stages (npm ci, dependency:go-offline, mvn package), which `mode=min` would
          # not keep at all.
          cache-from: type=gha,scope=source-image
          cache-to: type=gha,mode=max,scope=source-image

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Wait for the app to report healthy
        # The image's own HEALTHCHECK decides, so this also tests the healthcheck.
        # The container is resolved through compose, not by a fixed name: the stacks
        # carry no `container_name` any more, precisely so two of them can coexist.
        run: |
          set -euo pipefail
          explorer=$(docker compose ps -q explorer)
          [ -n "$explorer" ] || { echo "::error::no explorer container"; exit 1; }
          echo "EXPLORER_CID=$explorer" >> "$GITHUB_ENV"
          for _ in $(seq 1 72); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$explorer" 2>/dev/null || echo missing)
            case "$status" in
              healthy)   echo "healthy"; exit 0 ;;
              unhealthy) echo "::error::the container reported unhealthy"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::the app never became healthy"
          exit 1

      - name: Assert the deployment contract
        run: |
          set -euo pipefail
          # Serves, and separately: can reach the broker. readiness carries the Kafka
          # indicator, liveness does not — that split is the point.
          curl -fsS http://127.0.0.1:8080/actuator/health/liveness  | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/api/dashboard > /dev/null

          # The SPA's cache policy, which is a deployment contract and not a detail: a
          # browser reusing yesterday's index.html asks for lazy chunks this build no longer
          # has, the dynamic import fails, and the page dies on "Failed to fetch dynamically
          # imported module". index.html must revalidate; the content-hashed assets it names
          # can be cached forever. Asserted here because the assets only exist in a built
          # image — there is nothing to serve in a source checkout.
          curl -fsSI http://127.0.0.1:8080/ | grep -iq 'cache-control:.*no-cache' \
            || { echo "::error::index.html is not served no-cache — a stale one breaks lazy chunks after every deploy"; exit 1; }

          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::no hashed asset referenced by index.html"; exit 1; }
          curl -fsSI "http://127.0.0.1:8080$asset" | grep -iq 'cache-control:.*immutable' \
            || { echo "::error::$asset is not served immutable"; exit 1; }

          # Runs unprivileged.
          uid=$(docker compose exec -T explorer id -u | tr -d '[:space:]')
          [ "$uid" = "10001" ] || { echo "::error::running as uid $uid, expected 10001"; exit 1; }

          # File logging actually produces a file. Mounting a *file* that did not exist on
          # the host made Docker create a directory here, and Logback failed silently.
          docker compose exec -T explorer sh -c 'test -s /app/logs/kafkaexplorer.log' \
            || { echo "::error::no log file written"; exit 1; }

          # The Flink engine works in *this* image too. `release-image` asserts the same thing
          # on Dockerfile.release; this is the from-source `Dockerfile`, which is what every
          # compose stack runs and therefore what most people actually start. The two runtime
          # stages are meant to be identical and are built here precisely so they cannot drift
          # unnoticed — so the assertion has to exist on both, or the drift it guards against is
          # only half watched. Same failure: behind `JarLauncher` the system class loader cannot
          # see BOOT-INF/lib, Flink deserializes the job graph with it, and every SELECT falls
          # back to a reader that supports neither JOIN nor subqueries.
          #
          # Waited for, not grepped once: the probe runs after ApplicationReadyEvent and takes a
          # few seconds, so it can still be in flight when the container first reports healthy.
          # A gate that flakes is a gate people learn to ignore.
          warm=""
          for _ in $(seq 1 24); do
            docker compose logs --no-color explorer > /tmp/explorer.log 2>&1 || true
            if grep -q 'Failed to execute job' /tmp/explorer.log; then
              grep -n -m3 -B2 'Failed to execute job' /tmp/explorer.log || true
              echo "::error::a Flink job failed to submit in the from-source image — see FlinkConfig.applyJobClasspath"
              exit 1
            fi
            if grep -q 'Flink planner warmed up' /tmp/explorer.log; then warm=yes; break; fi
            sleep 5
          done
          [ -n "$warm" ] \
            || { echo "::error::the Flink warmup probe never reported success within 120s — the planner path is broken in the from-source image, or the probe no longer runs"; exit 1; }

      - name: Wait for the demo seeding, then assert it is idempotent
        run: |
          set -euo pipefail
          seeder=$(docker compose ps -aq demo-setup)
          for _ in $(seq 1 72); do
            [ "$(docker inspect -f '{{.State.Status}}' "$seeder")" = exited ] && break
            sleep 5
          done
          code=$(docker inspect -f '{{.State.ExitCode}}' "$seeder")
          [ "$code" = "0" ] || { docker logs "$seeder" | tail -50; echo "::error::seeder exited $code"; exit 1; }

          # A second run must skip: Kafka data outlives `down`, and re-seeding adds a
          # generation of duplicates to a dataset calibrated to report a known value.
          docker compose run --rm --no-deps demo-setup 2>&1 | tee /tmp/reseed.log
          grep -q "already present" /tmp/reseed.log \
            || { echo "::error::the seeder re-seeded an already-seeded cluster"; exit 1; }

      - name: Assert the planner can actually read a topic
        run: |
          set -euo pipefail
          # What the warmup probe cannot say.
          #
          # That probe is `SELECT 1`: table-less, parallelism 1, one slot. It proves the job
          # graph deserializes behind JarLauncher, which is real and is why the step above
          # keeps it — and it proves nothing about reading a topic. Two defects lived here for
          # months underneath a probe reporting success at every boot: a generated table option
          # the connector refuses (never validated at CREATE TABLE, only when a source is
          # built, so no table means no refusal) and a job asking for more slots than the
          # embedded cluster owns (one slot is always available). Both degraded every SELECT to
          # the direct reader, silently.
          #
          # This job is where that becomes checkable: a broker is up and the demo topics are
          # seeded. `engine` is the assertion, never latency — a gate that flakes is a gate
          # people learn to ignore — and the timeout in the body is generous for the same
          # reason. Verified locally against the pre-fix build, where this reads KAFKA_DIRECT.
          topic=demo.orders.1.received
          table=$(printf '%s' "$topic" | tr '.-' '__')
          body=$(printf '{"sql":"SELECT * FROM %s","maxRows":3,"timeout":45000,"readMode":"earliest-offset"}' "$table")

          for _ in $(seq 1 24); do
            out=$(curl -sS -m 90 -X POST http://localhost:8080/api/query/run-sync -H 'Content-Type: application/json' -d "$body" || true)
            engine=$(printf '%s' "$out" | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("engine") or "")' 2>/dev/null || true)
            if [ -n "$engine" ]; then break; fi
            sleep 5
          done

          echo "$out" | head -c 600; echo
          [ "$engine" = "FLINK" ] || {
            echo "::error::a plain SELECT on a seeded topic was answered by $engine, not the Flink planner — the engine is degraded in the from-source image (a refused connector option, or a job that cannot get its slots)"
            exit 1
          }

      - name: Stop the stack and assert a clean shutdown
        run: |
          set -euo pipefail
          docker compose stop
          code=$(docker inspect -f '{{.State.ExitCode}}' "$EXPLORER_CID")
          # 0, or 143 = 128+SIGTERM for a JVM that ran its shutdown hooks. 137 is
          # 128+SIGKILL: the grace period expired mid-shutdown, which is the failure this
          # whole `stop_grace_period` / graceful-shutdown pairing exists to prevent.
          case "$code" in
            0|143) echo "clean exit ($code)" ;;
            *)     echo "::error::explorer exited $code (137 means it was SIGKILLed)"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  # Dockerfile.release is what a tag actually publishes, and until now nothing built it
  # outside release.yml — so a change to it (the layered extraction, for one) was first
  # exercised by the release itself. It is cheap here: the JAR already exists.
  release-image:
    name: Build and boot the release image
    needs: build
    runs-on: ubuntu-latest
    # 15 was sized for the amd64 boot alone. The arm64 boot below runs a whole JVM through
    # QEMU, which is slower by a large multiple.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jar
          path: dist/
      - name: Stage the JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          [ ${#jars[@]} -eq 1 ] || { echo "::error::expected one JAR, found ${#jars[@]}"; exit 1; }
          cp "${jars[0]}" app.jar
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the release image
        # Was a bare `docker build`, which runs on the default `docker` driver and can
        # therefore use no exportable cache at all — this was the one image in the whole
        # repository built cold every single time. Through Buildx it shares a cache scope
        # with the identical build release.yml runs on a tag; GitHub makes the default
        # branch's caches readable from every other ref, so a push to main warms exactly
        # what the next release consumes, including the runtime stage's `RUN adduser`,
        # which release.yml would otherwise re-run under QEMU for the arm64 variant.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          push: false
          # Into the runner's daemon — the next step boots this exact image.
          load: true
          tags: kafka-explorer-release:ci
          # `mode=min`, unlike the from-source build above: this Dockerfile has no
          # expensive intermediate stage, and its one builder step (the layer extraction)
          # is invalidated by every new JAR anyway. What is worth keeping is the final
          # image's stable layers, which is precisely what min exports.
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=min,scope=release-image
      - name: Boot it
        # No broker: the app must still start and answer liveness. Readiness is expected
        # to be DOWN here, which is precisely what makes the split worth having.
        #
        # That "no broker" is also what makes this the one place in CI where the startup
        # audit's findings can be guarded. The stack in the `docker` job runs a healthy
        # broker, so the failure mode measured there — an application that says a great deal
        # and explains nothing while it cannot reach a cluster — cannot occur. Here it is the
        # default state, so the assertions below cost nothing extra and watch the exact
        # scenario that produced them.
        run: |
          set -euo pipefail
          # The level these assertions need is asked for, not inherited. The application's own
          # package ships at WARN, so the lines this job reads — the warmup probe's success,
          # and any INFO the restores emit on their happy path — are not written on a default
          # install, and the job below failed on exactly that. Forcing INFO here keeps the
          # assertions about *behaviour* (a Flink job really submits in the packaged image)
          # rather than about an operator's threshold. Note what it therefore no longer says:
          # that an operator reading the default log sees any of this.
          docker run -d --name release-probe -p 127.0.0.1:8080:8080 \
            -e LOGGING_LEVEL_COM_COMPAGNONSDUDEV_KAFKASQLEXPLORER=INFO \
            kafka-explorer-release:ci
          up=""
          for _ in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/liveness 2>/dev/null | grep -q '"status":"UP"'; then
              up=yes
              break
            fi
            sleep 5
          done
          if [ -z "$up" ]; then
            docker logs release-probe | tail -100
            echo "::error::the release image never answered liveness"
            exit 1
          fi

          uid=$(docker exec release-probe id -u | tr -d '[:space:]')
          [ "$uid" = "10001" ] || { echo "::error::release image runs as uid $uid"; exit 1; }

          # The CDS archive is really there, and this JVM can really map it. The image runs
          # with the JVM default `-Xshare:auto`, which is right — a container must boot even
          # when the archive is unusable, rather than refuse to start over an optimisation —
          # but that same leniency means a mis-wired archive costs ~90 MB and buys nothing,
          # in silence. `-Xshare:on` is the strict form: it exits non-zero rather than fall
          # back, so running it once here turns the silence into a failed build. Measured
          # gain when it does map: 7.74 s to 6.39 s, with 12 911 of 24 343 classes served
          # from it.
          docker exec release-probe test -s /app/application.jsa \
            || { echo "::error::no CDS archive in the image — the training run produced nothing"; exit 1; }
          docker exec release-probe java -XX:SharedArchiveFile=/app/application.jsa -Xshare:on -version >/dev/null 2>&1 \
            || { echo "::error::the CDS archive cannot be mapped by this JVM — it is ~90 MB buying nothing"; exit 1; }

          # A fixed window of unreachable-broker life, so the count below measures the same
          # thing from one run to the next.
          sleep 30
          logs=$(mktemp)
          docker logs release-probe > "$logs" 2>&1

          # --- The startup audit's regression guard -------------------------------------
          # One class (the admin client's AdminMetadataManager) wrote `Rebootstrapping with
          # Cluster(…)` at INFO on every metadata retry: measured at 101 943 of 103 775 lines,
          # ~2 300 a second, ~1.6 MB a minute into a named volume — burying the connection
          # failure it was reporting. It is pinned to WARN in application.yml, and the same
          # boot now costs ~410 lines.
          #
          # The ceiling is deliberately an order of magnitude above what is observed rather
          # than a tight fit. A gate that flakes is a gate people learn to ignore — the lesson
          # MOBILE-LAYOUT-SCOPE.md records about the layout probe — and nothing here needs
          # precision: a returned flood is ~70 000 lines in this window, so 5 000 separates
          # the two by more than tenfold in both directions.
          lines=$(wc -l < "$logs")
          echo "boot + 30s with no broker: $lines log lines"
          [ "$lines" -le 5000 ] || {
            echo "::error::$lines log lines in 30s without a broker (ceiling 5000) — something is logging per retry again; check logging.level in application.yml"
            awk '{print $5}' "$logs" | sort | uniq -c | sort -rn | head -5
            exit 1
          }

          # ...and the other half: the log must still *explain itself*. Both startup restores
          # used to report their failure at DEBUG, i.e. no line at all on a default install,
          # so an unreachable broker produced an application that had silently forgotten its
          # metric configurations and its validated field mappings with nothing connecting
          # the two. Each names its own topic, whichever of the two paths it took.
          grep -q 'did not answer' "$logs" \
            || { echo "::error::the startup summary does not name the unreachable broker"; exit 1; }
          for topic in internal.metrics.config internal.field.mappings; do
            grep -q "$topic" "$logs" \
              || { echo "::error::the restore of $topic reported nothing — it is back at DEBUG"; exit 1; }
          done

          # --- The Flink runtime actually works in the packaged artefact -----------------
          # This is the only place anything runs the SQL engine the way it is shipped, and
          # for a while it did not work at all. A job submitted to the embedded MiniCluster
          # carries no user jars, and Flink reads "no jars and no classpath" as "this job
          # needs nothing of its own" — so it deserializes the job graph with
          # `ClassLoader.getSystemClassLoader()`. That is right on a real cluster and wrong
          # in every packaged form of this application: behind `JarLauncher` (what this
          # image runs) the dependencies live in BOOT-INF/lib, the system loader sees the
          # launcher and nothing else, and the first operator came back as
          # `ClassNotFoundException: …CodeGenOperatorFactory`. Every SELECT then fell back
          # to the direct Kafka reader — so rows kept arriving, from a reader that supports
          # neither JOIN nor subqueries — and CREATE TABLE and INSERT INTO, which have no
          # fallback, simply failed. The suite stayed green throughout: it runs on a plain
          # classpath, where the application loader *is* the system loader.
          #
          # The warmup probe is what makes *this* checkable here, and only this: `SELECT 1`, no
          # broker needed, and it submits a real job. Its success line is therefore the
          # cheapest possible proof that job submission works in the shipped image. Both
          # outcomes are asserted rather than just grepping for the failure, so this fails
          # if the probe stops running at all (disabled, renamed, moved off the boot path)
          # instead of quietly passing on an absent line.
          #
          # It says nothing about *reading a topic*, which is the half that needs a broker:
          # the probe carries no table, so a connector option refused when a source is built
          # cannot reach it, and it runs at parallelism 1, so a job that cannot obtain its
          # slots cannot either. Both defects shipped under a green line here. That assertion
          # lives in the `docker` job, where a broker and seeded topics already exist.
          if grep -q 'Failed to execute job' "$logs"; then
            grep -n -m3 -B2 'Failed to execute job' "$logs" || true
            echo "::error::a Flink job failed to submit in the release image — the packaged app cannot run SQL; see FlinkConfig.applyJobClasspath"
            exit 1
          fi
          grep -q 'Flink planner warmed up' "$logs" \
            || { echo "::error::the Flink warmup probe never reported success — the planner path is broken in the packaged image, or the probe no longer runs"; exit 1; }

          docker rm -f release-probe

      # The release now ships an SBOM, and nothing read it. A pinned-by-digest JRE base is
      # what makes a build reproducible and is also what freezes its security patches
      # between Dependabot bumps — so the one thing worth knowing is what is actually
      # inside the image being published, and that was nobody's output.
      #
      # `exit-code: 0` on purpose: this reports, it does not gate. A scanner wired to fail
      # a build starts failing it for a CVE in a transitive dependency with no fix
      # available, on a morning nobody chose — and the reflex that follows is to ignore the
      # job, which is worse than not having it. It writes to the step summary, where a
      # human reads it when a release is being cut. Turning it into a gate later is
      # `exit-code: 1` plus `ignore-unfixed`, once the baseline is known to be clean.
      - name: Scan the release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kafka-explorer-release:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          output: trivy.txt

      - name: Publish the scan to the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Image vulnerability scan (HIGH/CRITICAL, fixable only)'
            echo
            if [ -s trivy.txt ]; then
              echo '```'
              cat trivy.txt
              echo '```'
            else
              echo 'No fixable HIGH or CRITICAL vulnerability reported.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # release.yml publishes linux/amd64 *and* linux/arm64, and docs/DOCKERHUB.md sells the
      # second one ("natively, not under emulation"). Nothing in this repository had ever
      # started it: every boot test above, and every build anywhere, was amd64. The JAR is
      # architecture-independent, so what is actually unverified is the other half of the
      # runtime image — the arm64 JRE base, the `RUN adduser` that executes under the target
      # architecture, and the `wget` the HEALTHCHECK calls.
      #
      # Here rather than in release.yml on purpose: a tag's image is already pushed by the
      # time it could be probed, so a failure there is a red release over an image the world
      # can already pull. Here it fails before the tag exists, which is the only moment the
      # information is still actionable. release.yml asserts the platform is *present* in the
      # index; this asserts it *runs*.
      #
      # Not on pull requests: the JVM starts under QEMU emulation, which takes minutes rather
      # than seconds, and the arm64 runtime stage moves only when a base image digest does —
      # a Dependabot bump lands on main and is caught there.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Build the release image for arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/arm64
          push: false
          load: true
          tags: kafka-explorer-release:ci-arm64
          # Reads the same scope as the amd64 build above and does not write it: the layers
          # differ by architecture, and letting a QEMU build rewrite the manifest the release
          # consumes would be the cache-scope collision this repository already fixed once.
          cache-from: type=gha,scope=release-image

      - name: Boot it under emulation
        if: github.event_name != 'pull_request'
        # Same contract as the amd64 boot — liveness UP with no broker, running as uid 10001
        # — with a much longer budget, because every instruction is being translated.
        run: |
          set -euo pipefail
          docker run -d --name release-probe-arm64 --platform linux/arm64 \
            -p 127.0.0.1:8081:8080 kafka-explorer-release:ci-arm64
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/actuator/health/liveness 2>/dev/null | grep -q '"status":"UP"'; then
              arch=$(docker exec release-probe-arm64 uname -m | tr -d '[:space:]')
              [ "$arch" = "aarch64" ] || { echo "::error::probe ran as $arch, not aarch64"; exit 1; }
              uid=$(docker exec release-probe-arm64 id -u | tr -d '[:space:]')
              [ "$uid" = "10001" ] || { echo "::error::arm64 image runs as uid $uid"; exit 1; }
              echo "arm64 image booted and answered liveness"
              docker rm -f release-probe-arm64
              exit 0
            fi
            sleep 10
          done
          docker logs release-probe-arm64 | tail -100
          echo "::error::the arm64 release image never answered liveness"
          exit 1

  # Twelve compose files ship here and the build parsed none of them. That is the exact shape
  # of rot this repository has been bitten by twice — a stack nobody runs, a Dockerfile nobody
  # builds — and `config` is the cheapest possible guard: a few seconds, no daemon, no network,
  # no images pulled. It resolves interpolation, merges the overlays and rejects an unknown
  # field, so a typo in a file that only runs on somebody's laptop fails here instead of there.
  #
  # The OVERLAYS are validated layered onto their base, never alone: on its own an overlay is
  # a set of services with no image, which is invalid — and that is not a quirk of the check
  # but the reason overlays and base files must be listed as pairs everywhere.
  #
  # No `needs`, like the documentation checks, and for the same reason: it reports before the
  # build does and it can never go red for somebody else's outage.
  compose-lint:
    name: Validate the compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve every stack and overlay combination
        run: |
          set -euo pipefail
          # The SpectraLLM stub this step used to fabricate is gone with the file that
          # needed it: `docker-compose-spectra.yml` `include:`d upstream's own compose from a
          # sibling checkout, so parsing it here meant inventing a fake of somebody else's
          # repository. `compose/spectra-hub.yml` includes nothing and pulls published
          # images, so every file below now resolves from this checkout alone.

          # One declaration — every base, and the overlays it accepts. The combinations are
          # GENERATED from it: each base alone, each base with each of its overlays, and each
          # base with all of them at once. That last shape was missing from the eighteen
          # hand-written combinations this replaces: docker-compose.yml's two overlays had
          # never been layered together, so nineteen combinations now come out of less data.
          #
          # A declaration rather than a rule read off the file names or off the directory,
          # and that is still the whole point: `compose/` holds bases and overlays alike, and
          # nothing about a path says which is which. It is now a much shorter list, because
          # the tree has ONE base that carries a broker instead of four near-copies of it —
          # docker-compose.yml, with schema-registry / ollama / image / limits layering onto
          # it in any combination. That is also what makes the coverage real rather than
          # nominal: `docker-compose.yml + all four` is a stack nobody could run before,
          # since -kafka4 and -llm were separate bases and could never be combined.
          #
          # What the generation buys is the guard below: a file is checked because it is
          # NAMED here, so an omission is structural rather than a string search over a list
          # of command lines.
          declare -A OVERLAYS=(
            [docker-compose.yml]="compose/schema-registry.yml compose/ollama.yml compose/image.yml compose/limits.yml compose/ci.yml"
            [compose/dev.yml]=""
            [compose/build.yml]=""
            [compose/spectra-hub.yml]="compose/spectra-hub.ingest.yml compose/spectra-hub.gpu.yml compose/spectra-hub.limits.yml"
          )

          named=""
          resolved=0
          # Sorted, because an associative array has no iteration order of its own and a log
          # whose lines move between runs is one nobody diffs.
          for base in $(printf '%s\n' "${!OVERLAYS[@]}" | sort); do
            named="$named $base ${OVERLAYS[$base]}"
            combos=("-f $base")
            every=""
            for overlay in ${OVERLAYS[$base]}; do
              combos+=("-f $base -f $overlay")
              every="$every -f $overlay"
            done
            if [ "$(printf '%s\n' ${OVERLAYS[$base]} | grep -c .)" -gt 1 ]; then
              combos+=("-f $base$every")
            fi
            for combo in "${combos[@]}"; do
              echo "· $combo"
              # shellcheck disable=SC2086 - the combination is a deliberate word list.
              docker compose $combo config -q
              resolved=$((resolved + 1))
            done
          done
          echo "$resolved combinations resolved"

          # Every compose file in the tree is named above, as a base or as somebody's overlay.
          # A new one added without a line there would be checked by nothing, which is the
          # situation this job exists to end — so the omission fails rather than passing
          # quietly. The reverse is covered by the loop itself: a file named here and absent
          # from disk fails at `config`.
          # The root base plus everything under compose/. This used to be a bare
          # `docker-compose*.yml` glob, which found all sixteen files while they all sat at
          # the root; unchanged, it would now find exactly one and go on passing — a guard
          # that silently stops guarding, which is what this job exists to prevent.
          for f in docker-compose.yml compose/*.yml; do
            case " $named " in
              *" $f "*) ;;
              *) echo "::error file=$f::$f is named as neither a base nor an overlay in the declaration above — add it to compose-lint"; exit 1 ;;
            esac
          done

  # Does this change touch the published-images stack? Five of six consecutive `main` runs
  # were red on the job below, every one of them found AFTER a merge, because it does not run
  # on pull requests — it pulls roughly two gigabytes to exercise a deployment file, which is
  # the right trade for every pull request and the wrong one for the handful that edit that
  # file. This makes the distinction, so those few get the feedback before merging and the
  # rest still pay nothing.
  #
  # A job with an `if:`, deliberately NOT a `paths:` filter on the workflow: `paths:` makes a
  # job SKIP, and a required check that skips blocks a merge for ever, whereas a job whose
  # `if:` is false reports success. Plain git rather than a filter action, because three lines
  # beat one more dependency to pin, review and update.
  # The demo seeder is the entrypoint of `demo-setup` in every bundled stack, and it takes
  # a real decision: seed, or skip, from two readings of the cluster. Nothing exercised it.
  # The `docker` job below asserts that a second run skips — the one path that has always
  # worked — while every branch that matters is a reading that FAILED, and those were
  # reasoned about rather than run. Both defects found there were in that gap: a marker
  # that made the seeder skip for ever once retention had emptied what it vouched for, and
  # an unreadable offset query counted as "the topic is empty", which re-seeds at every
  # `up` and adds a generation of duplicate records each time — quietly moving the numbers
  # the cluster audit and the Stream Flow traces are calibrated against.
  #
  # It stubs the Kafka CLIs rather than starting a broker: what is under test is a decision
  # taken from two command outputs, so a broker would cost minutes and prove nothing extra.
  # It needs no daemon, no network and no toolchain, which is why it is its own job rather
  # than a step inside one that does.
  seeder-logic:
    name: The demo seeder's decisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run every decision of seed-demo-once.sh
        run: ./seed-demo-once.test.sh

  hub-changes:
    name: Does this change touch the published-images stack?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base commit has to be in the clone for the diff below to resolve.
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "· not a pull request — the stack is booted"
            exit 0
          fi
          # Into a file, then grep the file — never `git diff | grep -q`, which is unsound
          # under `pipefail`: see the note on the wait loop further down.
          git diff --name-only '${{ github.event.pull_request.base.sha }}'...HEAD > changed.txt
          echo "· files changed:"; sed 's/^/    /' changed.txt
          # ci.yml is in the list because this job is DEFINED there: editing the workflow can
          # edit the stack's own assertions. setup-demo.sh / seed-demo-once.sh and
          # .env.example are in it because the stack mounts and reads them.
          if grep -qE '^(compose/spectra-hub|scripts/spectra-hub/|setup-demo\.sh$|seed-demo-once\.sh$|\.env\.example$|docs/check-image-pins\.py$|\.github/workflows/ci\.yml$)' changed.txt; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "· the published-images stack is affected — booting it"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "· nothing the published-images stack depends on changed — not booting it"
          fi

  # compose/spectra-hub.yml is the one stack made entirely of published images, so what
  # it can break is not the code but the WIRING: a service renamed out from under nginx's
  # hardcoded upstream, an ownership fix that stops covering the volume, an entrypoint that
  # crash-loops instead of waiting for its model. None of that is visible in `config`, and all
  # of it is visible thirty seconds into a boot.
  #
  # It runs WITHOUT the models (SPECTRA_AUTO_INSTALL_MODELS=false): the ~4.7 GB chat model is
  # the one part of this stack CI has no business downloading, and the interesting assertion
  # about it is precisely that its absence leaves the containers waiting rather than dead.
  #
  # Not on pull requests. It pulls roughly two gigabytes of images to test a deployment file
  # whose contents do not change with the code — the same trade-off as the arm64 boot in
  # release-image, and `workflow_dispatch` covers a branch that touches these files.
  spectra-hub-stack:
    name: Smoke-test the SpectraLLM stack
    needs: hub-changes
    if: needs.hub-changes.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose/spectra-hub.yml
      # Not the 4.7 GB default: see above. The stack is booted with no chat model at all, so
      # that the "it waits rather than crash-looping" assertion is about a real absence — and a
      # tiny one is then dropped in, which is what lets the last step prove the chain answers.
      SPECTRA_AUTO_INSTALL_MODELS: "false"
      LLM_CHAT_MODEL_FILE: Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      LLM_CHAT_MODEL_NAME: qwen2.5-0.5b-instruct
      # ~400 MB, and the smallest model that still answers a one-word health check coherently.
      # A wrong URL fails this job loudly at the fetch step; it is a one-line fix here.
      CI_CHAT_MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      # Pinned, and observed twice on two independent downloads before being written here.
      # It buys two things: a substituted or truncated file is refused rather than served to
      # the assertion below, and the fetcher's verification branch — which is what
      # SPECTRA_*_MODEL_SHA256 exists for — stops being code that CI never executes.
      CI_CHAT_MODEL_SHA256: 6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check-image-pins.py --published resolves the pin against the newest release too.
          fetch-tags: true

      # The staleness half of that check lives here rather than in docs-links, because it asks
      # the REGISTRY and the registry is the only authority on what an `up` can pull. A git tag
      # exists the moment it is pushed and the image only when the release workflow finishes —
      # asking the tags made this very check demand a bump to an image that was still building.
      # Here the network is already a dependency (the next step pulls those images), and a
      # registry that cannot be reached is reported rather than failing the build.
      - name: Is the Explorer pin still the current release?
        run: python3 docs/check-image-pins.py --published

      - name: Pull the published images
        run: docker compose pull --quiet

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the Explorer to report healthy
        run: |
          set -euo pipefail
          explorer=$(docker compose ps -q explorer)
          [ -n "$explorer" ] || { echo "::error::no explorer container"; exit 1; }
          for _ in $(seq 1 72); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$explorer" 2>/dev/null || echo missing)
            case "$status" in
              healthy)   echo "healthy"; exit 0 ;;
              unhealthy) echo "::error::the Explorer reported unhealthy"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::the Explorer never became healthy"
          exit 1

      - name: Assert the Explorer is wired to SpectraLLM
        # The entire point of the file. `GET /api/config` reports the running configuration,
        # so this fails if the environment stopped binding — a renamed variable, a provider
        # that no longer parses — rather than if a YAML key merely looks right.
        run: |
          set -euo pipefail
          body=$(curl -fsS http://127.0.0.1:8080/api/config)
          echo "$body" | grep -q '"llmProvider":"SPECTRA"' \
            || { echo "::error::the Explorer is not on the SPECTRA provider: $body"; exit 1; }
          echo "$body" | grep -q '"llmBaseUrl":"http://spectra-api:8080"' \
            || { echo "::error::the Explorer does not point at spectra-api: $body"; exit 1; }

      - name: Assert the Spectra API answers, and answers through the UI's proxy
        # Three claims that become true at three different moments: the API answers on its
        # published port, the UI serves, and nginx still resolves the upstream baked into its
        # image — which is why the service has to keep the name `spectra-api`, a constraint
        # nothing else in this repository can enforce.
        #
        # Each is POLLED, not asserted once. `docker compose up -d` returns when the containers
        # have started, not when a JVM has finished booting, and the frontend is gated on the
        # API's *healthcheck*, which lags its readiness by up to a probe interval. Asserting the
        # UI the instant the API answered passed on a slow runner and failed on a fast one — a
        # race in the test, on a stack that was fine.
        #
        # A probe that gives up prints the last reply, so the next failure explains itself
        # instead of being dug out of a thousand lines of container logs.
        run: |
          set -euo pipefail
          probe() {
            name="$1"; url="$2"; want="$3"
            for _ in $(seq 1 60); do
              body=$(curl -fsS "$url" 2>&1) && case "$body" in
                *"$want"*) echo "· $name answered"; return 0 ;;
              esac
              sleep 5
            done
            echo "::error::$name never answered ($url) — last reply: ${body:-(none)}"
            return 1
          }
          probe "the Spectra API" http://127.0.0.1:8081/actuator/health/readiness '"status":"UP"'
          probe "the Spectra UI" http://127.0.0.1:8088/ ""
          probe "the UI's /api/ proxy to spectra-api" http://127.0.0.1:8088/api/status ""

      - name: Assert a missing model leaves llama-server waiting, not crash-looping
        # The behaviour the inline entrypoints exist for. Without them llama-server would exit
        # on a model it cannot open and the restart policy would turn that into a loop — which
        # looks, in `ps`, exactly like a stack that is starting up.
        run: |
          set -euo pipefail
          for svc in llm-chat llm-embed; do
            cid=$(docker compose ps -q "$svc")
            [ -n "$cid" ] || { echo "::error::no $svc container"; exit 1; }
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            [ "$state" = running ] || { echo "::error::$svc is $state"; exit 1; }
            [ "$restarts" = 0 ] || { echo "::error::$svc restarted $restarts times"; exit 1; }
          done
          # The chat model is the one nothing downloads in this job, so this line is
          # deterministic where llm-embed's would be a race with an 81 MB transfer.
          #
          # Into a file, never piped into `grep -q`: that combination is unsound under
          # `pipefail` — see the next step, where it reported a pattern it had just found as
          # absent. Deterministic here only because the log is still short; the defect is in
          # the shape, not in the size, so it is not written that way anywhere in this job.
          docker compose logs --no-color llm-chat > "$RUNNER_TEMP/llm-chat.log" 2>&1
          grep -q 'waiting for' "$RUNNER_TEMP/llm-chat.log" \
            || { echo "::error::llm-chat did not report waiting for its model"; exit 1; }

      - name: Serve a tiny model, and prove the whole chain answers
        # The assertion this job existed without: that a Process Mining call really travels
        # explorer → spectra-api → llm-chat and comes back. It is what would have caught the
        # header mismatch this stack documents (Spectra reads `X-API-Key`, the Explorer sends
        # `Authorization: Bearer`) instead of leaving it a paragraph nobody executes.
        #
        # The model is fetched through the stack's OWN one-shot rather than by a curl written
        # here, so the fetcher — resume, checksum, ownership — is exercised too. `--no-deps`
        # because its dependency is a one-shot that has already completed.
        run: |
          set -euo pipefail
          # The fetch reaches huggingface.co, which is nobody's here. A default branch that
          # goes red meaning "HuggingFace was unavailable" is indistinguishable from one that
          # goes red meaning "the stack broke", and the second is the only one worth waking
          # somebody for. This repository already writes the right rule elsewhere — see
          # check-image-pins.py --published: "we asked and it is stale" and "we could not ask"
          # are different answers.
          #
          # So a failed TRANSFER warns and skips the end-to-end assertion, while every other
          # failure of the fetcher still fails the job. That distinction is the whole reason
          # the outcome is read from the fetcher's own message rather than from its exit code:
          # a digest that does not match is a substituted file, not a network problem, and
          # swallowing it would undo the pin two lines above.
          set +e
          out=$(docker compose run --rm --no-deps -T \
            -e SPECTRA_CHAT_MODEL_URL="$CI_CHAT_MODEL_URL" \
            -e SPECTRA_CHAT_MODEL_SHA256="$CI_CHAT_MODEL_SHA256" spectra-models 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            case "$out" in
              *"download FAILED"*)
                echo "::warning::the chat model could not be downloaded — the end-to-end assertion is SKIPPED, not failed. Everything up to here passed."
                exit 0 ;;
              *)
                echo "::error::the model fetcher failed for a reason that is not the transfer — a mismatched digest, or an image without sha256sum"
                exit 1 ;;
            esac
          fi

          # No restart: llama-server's entrypoint polls for the file and starts on its own,
          # which is the behaviour the previous step just asserted from the other side. What is
          # waited on is that entrypoint's own line rather than the container's health status —
          # the healthcheck belongs to the llama.cpp image and asserting through it would make
          # this step depend on a tool being present in somebody else's image, which is exactly
          # the assumption that put a curl in the fetcher.
          #
          # `docker compose logs … | grep -q` is what this was, and it cost a red run on a
          # stack that was working: `grep -q` exits on its first match and closes the pipe,
          # `docker compose logs` then dies of SIGPIPE, and `pipefail` reports the pipeline as
          # failed — with the pattern found. Whether that happens depends on whether the
          # producer had finished writing, so one iteration answered 0 and the next non-zero:
          # the loop broke on a match and the identical check right after it announced that
          # `[llm-chat] serving` had never appeared, while it sat in the log the failure
          # handler then dumped. The log goes to a file and the file is grepped — no pipe,
          # nothing to signal — and both the wait and the verdict read it through one
          # function, so they cannot disagree again.
          serving() {
            docker compose logs --no-color llm-chat > "$RUNNER_TEMP/llm-chat.log" 2>&1
            grep -q '\[llm-chat\] serving' "$RUNNER_TEMP/llm-chat.log"
          }
          for _ in $(seq 1 60); do
            serving && break
            sleep 5
          done
          serving || { echo "::error::llm-chat never picked up the model"; exit 1; }

          # The end-to-end call, retried while llama-server finishes loading the weights: the
          # Explorer asks SpectraLLM, SpectraLLM asks llama-server, and the answer comes back.
          for _ in $(seq 1 30); do
            answer=$(curl -fsS -X POST http://127.0.0.1:8080/api/config/test-llm || echo '{}')
            case "$answer" in *'"ok":true'*) ok=1; break ;; esac
            sleep 5
          done
          echo "${answer:-(no answer)}"
          [ "${ok:-0}" = 1 ] \
            || { echo "::error::the Explorer could not reach the model through SpectraLLM"; exit 1; }

      - name: Assert the demo seeding ran to completion
        run: |
          set -euo pipefail
          cid=$(docker compose ps -aq demo-setup)
          [ -n "$cid" ] || { echo "::error::no demo-setup container"; exit 1; }
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            [ "$state" = exited ] && break
            sleep 5
          done
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          [ "$code" = 0 ] || { echo "::error::demo-setup exited $code"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  # docs/DOCKERHUB.md is rendered by Docker Hub, outside the repository: every link in it is
  # absolute, none can be verified by reading the page, and one that rots stays invisible
  # until a visitor clicks it and lands on a 404 — on the page meant to sell the image. Its
  # screenshots come from GitHub Pages for the same reason and have the same exposure.
  #
  # No `needs`, and nothing on the network: this is a few milliseconds of path resolution, so
  # it reports before the build does, and it can never go red for somebody else's outage.
  docs-links:
    name: Check the documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check-image-pins.py compares the Explorer image the hub stack pulls against the
          # newest release tag, and the default checkout carries no tags at all — the check
          # would fail on their absence rather than on a drift.
          fetch-tags: true
      # Discovered, not listed. This was six `- run:` lines, so a seventh script would have
      # been executed by nothing until somebody remembered to add one — the same structural
      # argument compose-lint was rewritten for, left standing one job below it. What each
      # check answers, since the lines that said so are now this comment:
      #
      #   check-links       every repository link in the documentation resolves. docs/DOCKERHUB.md
      #                     is RENDERED OUTSIDE the repository, so none of its links can be
      #                     verified by reading the page and a rotten one stays invisible until a
      #                     visitor hits a 404 on the page that sells the image.
      #   check-config-table  every documented variable binds to a real property (application.yml,
      #                     a @ConfigurationProperties field, or an ENV of either runtime image),
      #                     the documented defaults match the YAML, and the base-image and
      #                     dependency-version claims match the Dockerfiles and the pom. The page
      #                     advertised a JRE two majors behind the image for a long while, and
      #                     that was found by reading it rather than by CI.
      #   check-api-types   every @java-marked interface in api/types.ts against the record it
      #                     mirrors, both ways. The frontend asserted its response types by hand,
      #                     which TypeScript believes without checking: when an endpoint started
      #                     returning records instead of strings nothing failed to compile and the
      #                     Compare page died at runtime, months later.
      #   check-doc-paths   every repository path the maintainer docs name in PROSE rather than
      #                     in a link — check-links.py never saw those, and three pointed at
      #                     documents and a directory deleted months earlier. docs/notes/ is
      #                     globbed, so a note added without being checked is not a hole.
      #   check-image-pins  the images the stacks pull: nothing floating, the llama.cpp CPU and
      #                     CUDA tags naming the same build, and no pin ahead of the newest
      #                     release. Its --published half asks the registry and runs in
      #                     spectra-hub-stack, where the network is already a dependency.
      #   check-compose     the stacks against .env.example and against themselves, the prompt
      #                     budget against the window each one serves included.
      #   check-eval-fixture the Process Mining eval fixture against setup-demo.sh, whose dataset
      #                     it claims to be. A fixture that has drifted does not fail — it
      #                     evaluates the wrong thing, confidently, which is what the eval exists
      #                     to remove.
      #   check-readme-parity README.md against README.fr.md — the shape, the commands, the
      #                     links and the paths, never the words. The two drift together when
      #                     edited together and silently apart when they are not, and nothing
      #                     read the READMEs at all: the whole "Build and Development" section
      #                     sat in both files TWICE, verbatim, for an unknown length of time.
      - name: Resolve every documentation check
        run: |
          set -euo pipefail
          for check in docs/check-*.py; do
            echo "· $check"
            python3 "$check"
          done

  # docs/img/*.png is what the Docker Hub overview, the READMEs and the Pages site show, and
  # it is generated by docs/screenshots/ rather than photographed. Nothing ran that pipeline,
  # which is the exact situation this repository has been bitten by before — a file nobody
  # executes rots quietly. Here it rots loudly instead.
  #
  # What this guards is not the pixels: no image is diffed, because antialiasing would fail
  # builds for nothing. It guards that every screen is still reachable and still renders its
  # finished state — each `settle` waits on a value only the loaded screen shows, so a page
  # that throws on mount, a control that was renamed, or a fixture that drifted from its
  # TypeScript contract all stop the run. That last one is not hypothetical: a missing
  # `TopicSearchResponse.elapsedMs` rendered "4,318 scanned in NaNs" rather than failing.
  #
  # The fresh captures are uploaded so a reviewer can look at what the change did to them.
  screenshots:
    name: Capture the documentation screenshots
    needs: build
    runs-on: ubuntu-latest
    # 15 was sized for the capture alone. This job now also runs the layout gate, which walks the
    # same eight pages again per viewport and waits each one out to `networkidle` — the first run
    # with it hit the old ceiling and was killed. The gate is restricted to two viewports for the
    # same reason; see CHECK_VIEWPORTS in layout-probe.mjs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No actions/setup-node: the runner image ships a current Node, and the two scripts
      # here are plain ESM with no dependency but Playwright, installed below.
      - name: Download JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jar
          path: dist/

      # The SPA is taken out of the JAR the build job produced rather than rebuilt with npm.
      # It is both cheaper and stricter: these are the assets that actually ship, so a
      # frontend that breaks only once bundled into the JAR is caught here too.
      - name: Extract the SPA from the JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          [ ${#jars[@]} -eq 1 ] || { echo "::error::expected one JAR, found ${#jars[@]}"; exit 1; }
          # unzip exits 11 and says nothing when the pattern matches no entry, which would
          # abort this step under `set -e` with no clue as to why.
          unzip -q "${jars[0]}" 'BOOT-INF/classes/static/*' -d unpacked \
            || { echo "::error::no BOOT-INF/classes/static in the JAR — was the build-frontend profile active?"; exit 1; }
          mv unpacked/BOOT-INF/classes/static site
          [ -f site/index.html ] || { echo "::error::the JAR's static resources carry no index.html"; exit 1; }

      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          npm install -g playwright@1
          playwright install --with-deps chromium

      # capture.mjs quantises each shot when it finds this, and silently ships images three
      # times larger when it does not. Installing it here is what keeps that path exercised,
      # and makes the uploaded artefact the same weight as what a developer would commit.
      - name: Install pngquant
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pngquant

      - name: Capture
        run: |
          set -euo pipefail
          node docs/screenshots/server.mjs site 4173 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/api/dashboard >/dev/null 2>&1 && break
            sleep 1
          done
          # capture.mjs exits non-zero if any screen fails — seven of eight would mean the
          # eighth silently disappears from the documentation.
          NODE_PATH="$(npm root -g)" node docs/screenshots/capture.mjs http://127.0.0.1:4173 fresh

      # W6 from MOBILE-LAYOUT-SCOPE.md. Every figure in that document was a reading from
      # whenever someone last remembered to take one; this makes a regression fail a build
      # instead. It reuses the server, the SPA and the Chromium this job already has — a job of
      # its own would rebuild all three to run a script that takes under a minute.
      - name: Check the layout has not regressed
        run: |
          set -euo pipefail
          # Its own server on its own port: whether the one the capture step backgrounded is
          # still listening is an implementation detail of the runner, and a gate that depends
          # on it fails for a reason that has nothing to do with the change under test.
          node docs/screenshots/server.mjs site 4174 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/api/dashboard >/dev/null 2>&1 && break
            sleep 1
          done
          NODE_PATH="$(npm root -g)" node docs/screenshots/layout-probe.mjs http://127.0.0.1:4174 --check

      # Les gestes des trois graphes SVG. `useGraphViewport` n'a qu'un test unitaire, sur son
      # arithmétique de zoom : le reste est de la plomberie d'événements pointeur au-dessus d'une
      # géométrie que jsdom n'a pas, où un test unitaire affirmerait que des mocks ont été appelés
      # plutôt qu'un graphe se déplace. Cette sonde a trouvé, dès sa première exécution, que le
      # zoom molette ne s'attachait plus sur deux des trois pages — un défaut livré et invisible
      # de toute autre façon. Même serveur, même SPA, même Chromium que les deux étapes ci-dessus.
      - name: Check the graph gestures still work
        run: |
          set -euo pipefail
          # Son propre port, même raison que l'étape précédente : dépendre du serveur qu'une
          # autre étape a laissé tourner fait échouer pour un motif étranger au changement testé.
          node docs/screenshots/server.mjs site 4175 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4175/api/dashboard >/dev/null 2>&1 && break
            sleep 1
          done
          NODE_PATH="$(npm root -g)" node docs/screenshots/graph-gestures.mjs http://127.0.0.1:4175

      - name: Upload the fresh captures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshots
          path: fresh/
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
