# Pushes docs/DOCKERHUB.md to the Docker Hub repository overview.
#
# The overview page is the only documentation most people see before `docker pull`, and
# Docker Hub has no way of reading a file out of a repository by itself: without this,
# the page stays whatever was last pasted into the web UI, and drifts from the image it
# describes one release at a time. The file in git is therefore the source of truth —
# editing the page on hub.docker.com is pointless, the next run overwrites it.
#
# Deliberately not part of release.yml: fixing a sentence on the overview page must not
# require cutting a version, and republishing the page costs nothing.
#
# Prerequisites (Settings → Secrets and variables → Actions):
#   - secret DOCKERHUB_USERNAME  — the account, not the organisation
#   - secret DOCKERHUB_TOKEN     — a Personal Access Token with **Read, Write, Delete**
#                                  scope. The description API rejects a read-only one,
#                                  and the failure reads as a 401 on an otherwise valid
#                                  token.
#   - variable DOCKERHUB_REPOSITORY (optional) — defaults to compagnonsdudev/kafkaexplorer.
#     Same variable as release.yml, so a fork repoints both at once. Its namespace must be
#     the DOCKERHUB_USERNAME account (or an organisation it belongs to): note that it is
#     deliberately not the GitHub org, which only governs the GHCR name.
#
# Reading a failure of this workflow: the step it dies on says which problem it is, and
# they are not the same problem.
#
#   404, setting the description — the Docker Hub repository does not exist yet. It is
#   created by the first `docker push`, i.e. by the first release, so a sync that runs
#   before any release legitimately fails this way. That is the truth, not something to
#   paper over.
#
#   401 at `Acquiring token` — the login itself is refused, before the description API is
#   ever reached, and the repository may well exist. Both secrets are necessarily set (the
#   guard below would otherwise have skipped the step), so the token is present and
#   rejected: a read-only PAT (the API needs Read, Write, Delete — this is the first
#   suspect), a DOCKERHUB_USERNAME that is not the login account (an organisation, or the
#   repository namespace), an account password instead of a PAT on a 2FA account, or
#   whitespace pasted into the secret.
#
# This file used to predict the 404 for the first sync and nothing else, which is exactly
# the run it got wrong: the repository had been created by hand, and three consecutive runs
# failed 401 while the comment explained a 404.
#
# The screenshots in that page are loaded from GitHub Pages by absolute URL (Docker Hub
# cannot reach repository files). Pages is deployed by ci.yml's `deploy` job on the same
# push, so a brand-new image may 404 for the few seconds between the two — it resolves on
# its own and is not worth serialising the workflows for.

name: Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - 'docs/DOCKERHUB.md'
      - '.github/workflows/dockerhub-description.yml'
  # After a release, because of the 404 above: the Docker Hub repository does not exist
  # until the first `docker push` creates it, so the sync that runs before any release
  # fails legitimately — and then never retries, since only an edit to the page triggers
  # it. The page therefore stays absent until somebody happens to touch the file. Here
  # that was patched up by hand; on a fork it would not be. This closes the loop: the
  # release creates the repository, and the description follows it.
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]
  workflow_dispatch:

# A second push while one sync is in flight would race for the same page.
concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  description:
    name: Sync overview page
    # A `workflow_run` fires whatever the release did, failure included — and a release
    # that failed may well have pushed no image, so there would be nothing to describe.
    # The other triggers carry no such event and must not be filtered out by it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same guard as release.yml, and for the same reason: a fork of this repository
      # inherits the workflow but not the secrets, and must skip rather than fail.
      - name: Is Docker Hub configured?
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — nothing to sync."
          fi

      - name: Push the overview page
        if: steps.hub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY || 'compagnonsdudev/kafkaexplorer' }}
          readme-filepath: docs/DOCKERHUB.md
          # Docker Hub truncates this at 100 *bytes* and shows it in search results (the
          # em dash is three of them). Kept identical to `org.opencontainers.image.description`
          # in release.yml, which is the same sentence read off the image manifest — change
          # one and change the other, or the registry contradicts itself.
          short-description: 'Explore Kafka, query it in Flink SQL, audit it with AI — one container, one URL.'
          # `enable-url-completion` is deliberately off. It rewrites relative links into
          # absolute ones, which this page has no use for — every link in it is already
          # absolute, and docs/check-links.py fails the build if one is not — while its
          # documented failure modes (inline code, links containing brackets) apply to a page
          # made almost entirely of both. It was buying nothing and risking a mangled render
          # of the only documentation most people ever read.
          enable-url-completion: false
