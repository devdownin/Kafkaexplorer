name: Release Guardian

# CI failures are diagnosed, never retried blindly. Scheduled/manual sweeps
# close only old, release-only bot PRs after checking their changed file list.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI & Deployment"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    # Run the trusted default branch code only, even when the triggering CI run
    # was caused by a pull request. Never check out the triggering PR's head.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Diagnose failed CI jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 ci/release-guardian.py --run-id "$RUN_ID"
      - name: Close demonstrably superseded release follow-up PRs
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release-guardian.py --close
