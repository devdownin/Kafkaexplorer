services:
  # ── Kafka broker (KRaft, single node) ─────────────────────────────────────
  # `extends`, not a copy. The resolved service was byte-identical to the one in
  # docker-compose.yml — healthcheck, grace period, restart policy, every KRaft
  # setting — so the sixty lines of reasoning that go with them (what a 5s probe
  # interval costs, what a flushing broker needs before SIGKILL, why
  # __consumer_offsets has one partition, why CLUSTER_ID is fixed) are read and
  # maintained in ONE file instead of four, and cannot drift the day only one copy
  # is touched.
  #
  # This does not turn the file into an overlay: `extends` reuses a single service,
  # so `docker compose -f <this file> up -d` is exactly what it was. No
  # `container_name` anywhere either — it is daemon-global, so two stacks could
  # never run side by side; address services by service name.
  #
  # `depends_on` is restated rather than inherited: Compose v5 does carry it through
  # `extends` and earlier specifications excluded it. Top-level volumes are NOT
  # inherited, which is why `kafka_data` is still declared at the bottom of this
  # file.
  kafka:
    extends:
      file: docker-compose.yml
      service: kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a fresh
  # named volume owned by root — chown it once before the broker starts. Identical to
  # docker-compose.yml's, so it is taken from there rather than restated.
  kafka-data-init:
    extends:
      file: docker-compose.yml
      service: kafka-data-init

  ollama:
    # A pinned version, not `latest`: a floating tag would silently change the model runtime
    # under a stack meant to be reproducible.
    image: ollama/ollama:0.32.6
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # THE PROMPT HAS TO FIT, and nothing was making it. Ollama's context window defaults to
      # 4 096 tokens unless the machine has the VRAM for more (`OLLAMA_CONTEXT_LENGTH`, whose
      # own help text reads "4k/32k/256k based on VRAM"), the app's OpenAI-compatible client
      # sends `model`, `messages`, `max_tokens`, `temperature` and `stream` — never `num_ctx`,
      # which that endpoint would not read from the body anyway — and `process-mining`'s prompt
      # budget is 120 000 characters, about 30 000 tokens. Ollama does not refuse the excess: it
      # drops the oldest messages until the prompt fits and logs it at DEBUG, i.e. nowhere on a
      # default install. So a Process Mining analysis here was reasoning on a fraction of what
      # it had been given, with nothing on screen or in the log saying which fraction.
      #
      # 16 384 total, against a prompt budget lowered to match below. Raise the two together or
      # neither: a wider window without a wider budget buys nothing, and the reverse silently
      # truncates again. The cost is the KV cache — roughly 2 GB at this size for a 7B model, on
      # a stack that ships no memory limit.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    # A model load can take a while to unwind; and like the broker, it should come back
    # with the app after a daemon restart.
    stop_grace_period: 30s
    restart: unless-stopped

  ollama-pull-model:
    # Pinned like everything else in this tree. The comment on the ollama image above claimed
    # to be "the only floating tag left", two services above this one — `latest` here served
    # whatever curl was published the day of the pull, in a one-shot whose entire job is a
    # single HTTP request.
    image: curlimages/curl:8.21.0
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "sh", "-c", "curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:7b\"}'" ]

  explorer:
    build: .
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    # Neither the demo seed nor the model pull is needed to boot: the app starts with the
    # broker, and the LLM is only reached when Process Mining is actually used. Waiting on
    # `ollama-pull-model` in particular held the UI back for the whole multi-gigabyte
    # download of qwen2.5-coder:7b.
    depends_on:
      kafka:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Bundled broker is Kafka 4.3 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
      - CLAUDE_PROVIDER=OPENAI_COMPATIBLE
      - CLAUDE_BASE_URL=http://ollama:11434/v1
      - CLAUDE_MODEL=qwen2.5-coder:7b
      # The other half of OLLAMA_CONTEXT_LENGTH above: ~16 000 characters is ~4 000 tokens,
      # which fits the window with room left for the JSON answer. The shipped default of
      # 120 000 does not fit, and what a model cannot see it does not report as missing.
      - PROCESS_MINING_PROMPT_CHAR_BUDGET=${EXPLORER_PROMPT_CHAR_BUDGET:-16000}
      # 60 s is the shipped default and it is sized for a hosted API. A 7B model quantised to Q4
      # on CPU takes minutes on a prompt this size, and a request timeout is TERMINAL on this
      # path — retrying replays the whole prompt on a model that has already shown it needs
      # longer, tripling the load and the wait for the same outcome.
      - CLAUDE_REQUEST_TIMEOUT_SECONDS=${EXPLORER_LLM_TIMEOUT:-300}
    volumes:
      # See docker-compose.yml: the bind mount this replaces pointed at a file that does
      # not exist in the checkout, so Docker created a directory and file logging failed.
      - explorer_logs:/app/logs
      - explorer_data:/app/data
    stop_grace_period: 35s
    restart: unless-stopped

  # ── Seed demo topics (76) ─────────────────────────────────────────────────
  # Idempotent: seed-demo-once.sh skips when the marker topic `internal.demo.seeded`
  # is already there. Identical to docker-compose.yml's, so it is taken from there —
  # including the bind mounts, which is why this stack needs the checkout.
  demo-setup:
    extends:
      file: docker-compose.yml
      service: demo-setup

volumes:
  ollama_data:
  kafka_data:
  explorer_logs:
  explorer_data:
