services:
  # No `container_name`. It is a *daemon-global* name, so two stacks could never run
  # side by side — and these files share it (`kafka`, `kafka-sql-explorer`), which also
  # made switching between them without a `down` first fail on a name collision. Compose
  # derives `<project>-<service>-<n>` instead, so `docker compose -p other … up` is enough
  # to get a second, fully independent stack.
  #
  # The project name still defaults to the directory, so `kafka_data` keeps its name and
  # the topics you already seeded are still there. Address services by service name:
  # `docker compose logs kafka`, `docker compose exec explorer sh`.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    # A stopping KRaft node flushes its logs and closes the group / share-state
    # coordinators cleanly. Docker's default grace period is 10s, past which the broker is
    # SIGKILLed mid-flush and the next start has to recover the log segments — on a seeded
    # demo volume that turns a ten-second boot into a much longer one.
    stop_grace_period: 30s
    # `unless-stopped`, not the absent default: after a host reboot or a Docker daemon
    # restart the broker comes back with the app, which does carry a restart policy. It
    # did not, so the stack came back up as an explorer pointed at nothing.
    restart: unless-stopped
    # `kafka-broker-api-versions.sh` starts a whole JVM. At the previous `interval: 5s`
    # that cost ran every five seconds for the entire life of the stack — roughly a fifth
    # of a core, permanently, to re-answer a question settled during the first minute.
    # The interval now describes the steady state and `start_period` covers the boot,
    # during which failures do not count against `retries`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  kafka-data-init:
    image: apache/kafka:4.3.1
    user: root
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev-backend
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    volumes:
      - .:/app
      # `~/.m2` was bind-mounted from the host — the one thing this stack exists to
      # avoid. It required (or silently created, root-owned) a Maven directory on a
      # machine that may have no Maven at all. A named volume caches just as well and
      # belongs to the stack: `docker compose -f docker-compose-dev.yml down -v` resets it.
      - m2_cache:/root/.m2
      # Keeps target/ out of the bind mount: no root-owned build output in the host
      # checkout, and no bind-mount I/O on the thousands of files Maven writes there
      # (which is most of the compile time on macOS and Windows).
      - backend_target:/app/target
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    # Same reason as the packaged app: the JVM's bean destruction plus the graceful web
    # shutdown outlast Docker's default 10s. No restart policy on purpose — a backend that
    # fails to compile should stay down and say so, not loop.
    stop_grace_period: 35s
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev-frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VITE_PORT:-5173}:5173"
    volumes:
      - ./src/main/webapp:/app
      # Shadows the bind mount: the container's Linux-native dependencies stay in the
      # container, and the host checkout keeps no node_modules of its own.
      - frontend_node_modules:/app/node_modules
      - npm_cache:/npm-cache
    environment:
      # Read by vite.config.ts. Vite's proxy targeted `localhost:8080`, which inside
      # this container is the frontend itself — every /api call in the dev stack was
      # proxied into the void. VITE_API_URL, which used to be set here, is read by
      # nothing in the codebase.
      - VITE_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend

volumes:
  kafka_data_dev:
  m2_cache:
  backend_target:
  frontend_node_modules:
  npm_cache:
