version: '3.8'

services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka-dev
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  kafka-data-init:
    image: apache/kafka:4.2.0
    user: root
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev-backend
    container_name: kafka-explorer-backend
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev-frontend
    container_name: kafka-explorer-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/main/webapp:/app
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  kafka_data_dev:
