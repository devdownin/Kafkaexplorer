services:
  # ── Kafka broker (KRaft, single node) ─────────────────────────────────────
  # `extends`, not a copy. The resolved service was byte-identical to the one in
  # docker-compose.yml — healthcheck, grace period, restart policy, every KRaft
  # setting — so the sixty lines of reasoning that go with them (what a 5s probe
  # interval costs, what a flushing broker needs before SIGKILL, why
  # __consumer_offsets has one partition, why CLUSTER_ID is fixed) are read and
  # maintained in ONE file instead of four, and cannot drift the day only one copy
  # is touched.
  #
  # This does not turn the file into an overlay: `extends` reuses a single service,
  # so `docker compose -f <this file> up -d` is exactly what it was. No
  # `container_name` anywhere either — it is daemon-global, so two stacks could
  # never run side by side; address services by service name.
  #
  # `depends_on` is restated rather than inherited: Compose v5 does carry it through
  # `extends` and earlier specifications excluded it. Top-level volumes are NOT
  # inherited, which is why `kafka_data` is still declared at the bottom of this
  # file.
  kafka:
    extends:
      file: docker-compose.yml
      service: kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a fresh
  # named volume owned by root — chown it once before the broker starts. Identical to
  # docker-compose.yml's, so it is taken from there rather than restated.
  kafka-data-init:
    extends:
      file: docker-compose.yml
      service: kafka-data-init

  # Named `explorer` in every stack. Two of these files called it `app` and three called
  # it `explorer`, so `docker compose logs <name>` depended on which file you had opened,
  # and an overlay (docker-compose.limits.yml) cannot target a service whose name changes
  # between stacks — compose would treat the other name as a new, imageless service.
  explorer:
    build:
      context: .
      dockerfile: Dockerfile.release
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Bundled broker is Kafka 4.3 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    volumes:
      # Logs and the Flink job store survive `up --build` replacing the container, which
      # update.ps1 does on every release.
      - explorer_logs:/app/logs
      - explorer_data:/app/data
    # See docker-compose.yml: graceful web shutdown plus bean destruction needs more than
    # Docker's default 10s before the JVM is SIGKILLed.
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  kafka_data:
  explorer_logs:
  explorer_data:
