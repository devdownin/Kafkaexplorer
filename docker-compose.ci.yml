# Overlay used by the `docker` job of ci.yml to run the default stack against the image
# it has just built, instead of rebuilding it through `build: .`.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build
#
# It is deliberately thin: the point of the smoke test is to exercise
# docker-compose.yml as a user gets it, so nothing here changes the deployment's shape —
# only where the image comes from and how fast the demo data is produced.
services:
  explorer:
    image: kafka-sql-explorer:ci
    # The tag exists only in the runner's local daemon; without this compose would try to
    # pull it from Docker Hub and fail.
    pull_policy: never

  demo-setup:
    environment:
      # The real pause between the traced order's hops exists to give Stream Flow a hop
      # latency to chart. CI does not read the chart, and 0 is the documented setting for
      # the fastest seeding.
      DEMO_HOP_DELAY: "0"
