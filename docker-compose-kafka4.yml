services:
  # ── Kafka broker (KRaft, single node) ─────────────────────────────────────
  # `extends`, not a copy. The resolved service was byte-identical to the one in
  # docker-compose.yml — healthcheck, grace period, restart policy, every KRaft
  # setting — so the sixty lines of reasoning that go with them (what a 5s probe
  # interval costs, what a flushing broker needs before SIGKILL, why
  # __consumer_offsets has one partition, why CLUSTER_ID is fixed) are read and
  # maintained in ONE file instead of four, and cannot drift the day only one copy
  # is touched.
  #
  # This does not turn the file into an overlay: `extends` reuses a single service,
  # so `docker compose -f <this file> up -d` is exactly what it was. No
  # `container_name` anywhere either — it is daemon-global, so two stacks could
  # never run side by side; address services by service name.
  #
  # `depends_on` is restated rather than inherited: Compose v5 does carry it through
  # `extends` and earlier specifications excluded it. Top-level volumes are NOT
  # inherited, which is why `kafka_data` is still declared at the bottom of this
  # file.
  kafka:
    extends:
      file: docker-compose.yml
      service: kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a fresh
  # named volume owned by root — chown it once before the broker starts. Identical to
  # docker-compose.yml's, so it is taken from there rather than restated.
  kafka-data-init:
    extends:
      file: docker-compose.yml
      service: kafka-data-init

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    # Its own readiness, so `app` waits for a registry that answers rather than for a
    # container that has merely been created — Avro schema lookups on the first topics
    # opened would otherwise race the registry's startup.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Named `explorer` in every stack. Two of these files called it `app` and three called
  # it `explorer`, so `docker compose logs <name>` depended on which file you had opened,
  # and an overlay (docker-compose.limits.yml) cannot target a service whose name changes
  # between stacks — compose would treat the other name as a new, imageless service.
  explorer:
    build: .
    ports:
      # Published on the loopback interface only. This application has no authentication
      # and `POST /api/config` can repoint the Kafka cluster at runtime, so binding it to
      # 0.0.0.0 — the Docker default — offered it to the whole LAN. Set BIND_ADDR to expose
      # it deliberately: `BIND_ADDR=0.0.0.0 docker compose up -d`.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    # Not on `demo-setup`: the app has no need of the demo data to boot, and waiting for
    # the seed left the UI unreachable for the minute-plus it takes. Topics appear in the
    # Dashboard as they are created.
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      # Bundled broker is Kafka 4.3 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    volumes:
      - explorer_logs:/app/logs
      - explorer_data:/app/data
    # See docker-compose.yml: graceful web shutdown plus bean destruction needs more than
    # Docker's default 10s before the JVM is SIGKILLed.
    stop_grace_period: 35s
    restart: unless-stopped

  # ── Seed demo topics (76) ─────────────────────────────────────────────────
  # Idempotent: seed-demo-once.sh skips when the marker topic `internal.demo.seeded`
  # is already there. Identical to docker-compose.yml's, so it is taken from there —
  # including the bind mounts, which is why this stack needs the checkout.
  demo-setup:
    extends:
      file: docker-compose.yml
      service: demo-setup

  # Avro topics need `kafka-avro-console-producer`, which ships with the Confluent
  # distribution rather than with apache/kafka — hence the second seeder, and hence
  # its absence from the Schema-Registry-less stacks. Nothing depends on it: the
  # topics simply show up in the UI once it finishes, and the script exits 0 when
  # the registry is unreachable, so a hiccup here never blocks the stack.
  demo-setup-avro:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      schema-registry:
        condition: service_started
      demo-setup:
        condition: service_completed_successfully
    volumes:
      - ./setup-demo-avro.sh:/data/setup-demo-avro.sh
    entrypoint: [ "sh", "-c", "cp /data/setup-demo-avro.sh /tmp/setup-demo-avro.sh && sed -i 's/\\r$//' /tmp/setup-demo-avro.sh && bash /tmp/setup-demo-avro.sh kafka:29092 http://schema-registry:8081" ]

volumes:
  kafka_data:
  # Declared because the explorer service mounts them. They were not, so this stack — the one
  # this repository recommends — refused to start at all: `service "explorer" refers to
  # undefined volume explorer_logs: invalid compose project`, from the moment the two mounts
  # were added. Nothing caught it because nothing parsed these files; the compose-lint job in
  # ci.yml now does.
  explorer_logs:
  explorer_data:
