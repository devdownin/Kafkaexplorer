version: '3.8'

services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Single-node dev: 1 __consumer_offsets partition instead of the default 50
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Share groups (KIP-932, Kafka 4.1+) state topic on a single node
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # internal.audit.history / internal.metrics.config are auto-created on first write
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Fixed KRaft cluster id — the apache/kafka image reads CLUSTER_ID
      # (KAFKA_CLUSTER_ID would be passed to server.properties and ignored)
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      # Persist data & metadata logs across restarts — KRaft re-uses the storage
      # formatted with the fixed CLUSTER_ID above, so metric configs and audit
      # history (internal.* topics) survive `docker compose down`.
      # `docker compose down -v` still resets everything.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a
  # fresh named volume owned by root — chown it once before the broker starts.
  kafka-data-init:
    image: apache/kafka:4.2.0
    user: root
    volumes:
      - kafka_data:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  app:
    build: .
    container_name: kafka-sql-explorer
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      demo-setup:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      # Bundled broker is Kafka 4.2 — use the KIP-848 rebalance protocol for the live consumer
      - KAFKA_CONSUMER_GROUP_PROTOCOL=consumer
    restart: always

  demo-setup:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./setup-demo.sh:/data/setup-demo.sh
    entrypoint: [ "sh", "-c", "cp /data/setup-demo.sh /tmp/setup-demo.sh && sed -i 's/\\r$//' /tmp/setup-demo.sh && echo 'Waiting for Kafka...' && until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1; do sleep 2; done && bash /tmp/setup-demo.sh kafka:29092" ]

  # Avro topics need `kafka-avro-console-producer`, which ships with the Confluent
  # distribution rather than with apache/kafka — hence the second seeder, and hence
  # its absence from the Schema-Registry-less stacks. Nothing depends on it: the
  # topics simply show up in the UI once it finishes, and the script exits 0 when
  # the registry is unreachable, so a hiccup here never blocks the stack.
  demo-setup-avro:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      schema-registry:
        condition: service_started
      demo-setup:
        condition: service_completed_successfully
    volumes:
      - ./setup-demo-avro.sh:/data/setup-demo-avro.sh
    entrypoint: [ "sh", "-c", "cp /data/setup-demo-avro.sh /tmp/setup-demo-avro.sh && sed -i 's/\\r$//' /tmp/setup-demo-avro.sh && bash /tmp/setup-demo-avro.sh kafka:29092 http://schema-registry:8081" ]

volumes:
  kafka_data:
